  let music = null;

  function storedMusicOn() {
    try {
      return window.localStorage.getItem(MUSIC_KEY) !== '0';
    } catch {
      return true;
    }
  }

  function storedPlayMode() {
    try {
      return window.localStorage.getItem(PLAY_MODE_KEY) === 'text' ? 'text' : 'interactive';
    } catch {
      return 'interactive';
    }
  }

  const state = {
    view: 'home',
    draft: newDraft('modern'),
    record: readRecord(),
    run: null,
    legacy: null,
    auto: false,
    musicOn: storedMusicOn(),
    playMode: storedPlayMode(),
    replay: null,
    showAllAchievements: false,
    achPage: 0,
    pendingScroll: 'top',
  };

  const WORLD_GLYPHS = {
    modern: '城',
    cultivation: '山',
    wasteland: '荒',
    magic: '魔',
    cyber: '赛',
    starship: '星',
    jianghu: '江',
  };

  function newDraft(worldId) {
    return {
      worldId: worldId || 'modern',
      alloc: emptyAlloc(),
      choices: drawTalents(worldId || 'modern', TALENT_DRAW_COUNT),
      selectedIds: [],
      refreshes: TALENT_REFRESH_LIMIT,
      gender: pick(GENDERS).key,
    };
  }

  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[ch]));
  }

  function selectedTalents() {
    return state.draft.selectedIds
      .map(id => state.draft.choices.find(item => item.id === id))
      .filter(Boolean);
  }

  function remainingPoints() {
    return TOTAL_POINTS - sumAlloc(state.draft.alloc);
  }

  function canStart() {
    return remainingPoints() === 0 && selectedTalents().length === TALENT_PICK_COUNT;
  }

  function currentWorld() {
    return WORLD_BY_ID[state.draft.worldId] || WORLDS[0];
  }

  function showToast(message) {
    toastEl.textContent = message;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1900);
  }

  const MUSIC_BEAT = 60 / 84;
  const MUSIC_BAR = MUSIC_BEAT * 4;
  const MUSIC_PROGRESSION = [
    { bass: 130.81, notes: [261.63, 329.63, 392.00, 493.88] },
    { bass: 123.47, notes: [293.66, 392.00, 493.88, 587.33] },
    { bass: 110.00, notes: [261.63, 329.63, 392.00, 440.00] },
    { bass: 87.31, notes: [220.00, 261.63, 329.63, 349.23] },
    { bass: 130.81, notes: [261.63, 329.63, 392.00, 493.88] },
    { bass: 82.41, notes: [196.00, 246.94, 293.66, 329.63] },
    { bass: 87.31, notes: [220.00, 261.63, 329.63, 349.23] },
    { bass: 98.00, notes: [246.94, 293.66, 329.63, 392.00] },
  ];
  const MUSIC_SCALE = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
  const MUSIC_PATTERNS = [
    [0, 2, 4, 5],
    [2, 4, 5, 4],
    [4, 3, 2, 0],
    [2, 3, 4, 2],
    [5, 4, 3, 2],
    [0, 2, 3, 5],
    [4, 5, 4, 2],
    [2, 0, 1, 2],
  ];
  const MUSIC_ARPEGGIO = [0, 1, 2, 3, 2, 1, 2, 3];

  function makeImpulse(ctx) {
    const seconds = 2.8;
    const length = Math.floor(ctx.sampleRate * seconds);
    const buffer = ctx.createBuffer(2, length, ctx.sampleRate);
    for (let channel = 0; channel < 2; channel += 1) {
      const data = buffer.getChannelData(channel);
      for (let i = 0; i < length; i += 1) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.4);
      }
    }
    return buffer;
  }

  function initMusic() {
    if (music) return music;
    const AudioCtor = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtor) return null;
    try {
      const ctx = new AudioCtor();
      const master = ctx.createGain();
      master.gain.value = 0.15;
      const compressor = ctx.createDynamicsCompressor();
      compressor.threshold.value = -20;
      compressor.knee.value = 20;
      compressor.ratio.value = 3.5;
      compressor.attack.value = 0.02;
      compressor.release.value = 0.35;
      master.connect(compressor);
      compressor.connect(ctx.destination);

      const bus = ctx.createGain();
      bus.gain.value = 0.0001;
      bus.connect(master);

      const convolver = ctx.createConvolver();
      convolver.buffer = makeImpulse(ctx);
      const reverbWet = ctx.createGain();
      reverbWet.gain.value = 0.24;
      bus.connect(convolver);
      convolver.connect(reverbWet);
      reverbWet.connect(master);

      const delay = ctx.createDelay(1);
      delay.delayTime.value = 0.32;
      const feedback = ctx.createGain();
      feedback.gain.value = 0.2;
      const delayWet = ctx.createGain();
      delayWet.gain.value = 0.14;
      bus.connect(delay);
      delay.connect(feedback);
      feedback.connect(delay);
      delay.connect(delayWet);
      delayWet.connect(master);

      const noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * 4, ctx.sampleRate);
      const noiseData = noiseBuffer.getChannelData(0);
      for (let i = 0; i < noiseData.length; i += 1) noiseData[i] = Math.random() * 2 - 1;
      const noise = ctx.createBufferSource();
      noise.buffer = noiseBuffer;
      noise.loop = true;
      const noiseFilter = ctx.createBiquadFilter();
      noiseFilter.type = 'lowpass';
      noiseFilter.frequency.value = 800;
      const noiseGain = ctx.createGain();
      noiseGain.gain.value = 0.0035;
      noise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(bus);
      noise.start();

      music = {
        ctx,
        master,
        bus,
        delay,
        convolver,
        reverbWet,
        noiseGain,
        playing: false,
        stopped: false,
        timer: null,
        nextBar: 0,
        barIndex: 0,
        mood: 'life',
      };
      return music;
    } catch {
      return null;
    }
  }

  function padVoice(freq, when, duration, gain, pan, detune) {
    if (!music) return;
    const ctx = music.ctx;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 1800;
    filter.Q.value = 0.35;
    const envelope = ctx.createGain();
    envelope.gain.setValueAtTime(0.0001, when);
    envelope.gain.exponentialRampToValueAtTime(gain, when + 1.3);
    envelope.gain.exponentialRampToValueAtTime(0.0001, when + duration);
    const panner = typeof ctx.createStereoPanner === 'function' ? ctx.createStereoPanner() : null;
    if (panner) panner.pan.value = pan;
    filter.connect(envelope);
    if (panner) {
      envelope.connect(panner);
      panner.connect(music.bus);
    } else {
      envelope.connect(music.bus);
    }
    [0, 6].forEach((extraDetune, index) => {
      const osc = ctx.createOscillator();
      osc.type = index === 0 ? 'sine' : 'triangle';
      osc.frequency.value = freq;
      osc.detune.value = detune + extraDetune;
      osc.connect(filter);
      osc.start(when);
      osc.stop(when + duration + 0.2);
    });
  }

  function bassVoice(freq, when, duration) {
    if (!music) return;
    const ctx = music.ctx;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 260;
    const envelope = ctx.createGain();
    envelope.gain.setValueAtTime(0.0001, when);
    envelope.gain.exponentialRampToValueAtTime(0.06, when + 0.14);
    envelope.gain.exponentialRampToValueAtTime(0.0001, when + duration);
    osc.connect(filter);
    filter.connect(envelope);
    envelope.connect(music.bus);
    osc.start(when);
    osc.stop(when + duration + 0.1);
  }

  function pluckVoice(freq, when, gain, pan) {
    if (!music) return;
    const ctx = music.ctx;
    const osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(3800, when);
    filter.frequency.exponentialRampToValueAtTime(1400, when + 0.7);
    const envelope = ctx.createGain();
    envelope.gain.setValueAtTime(0.0001, when);
    envelope.gain.exponentialRampToValueAtTime(gain, when + 0.01);
    envelope.gain.exponentialRampToValueAtTime(0.0001, when + 1.25);
    const panner = typeof ctx.createStereoPanner === 'function' ? ctx.createStereoPanner() : null;
    if (panner) panner.pan.value = pan;
    osc.connect(filter);
    filter.connect(envelope);
    if (panner) {
      envelope.connect(panner);
      panner.connect(music.bus);
    } else {
      envelope.connect(music.bus);
    }
    osc.start(when);
    osc.stop(when + 1.25);
  }


  function drumVoice(when, gain) {
    if (!music) return;
    const ctx = music.ctx;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(116, when);
    osc.frequency.exponentialRampToValueAtTime(42, when + 0.16);
    const envelope = ctx.createGain();
    envelope.gain.setValueAtTime(0.0001, when);
    envelope.gain.exponentialRampToValueAtTime(gain, when + 0.006);
    envelope.gain.exponentialRampToValueAtTime(0.0001, when + 0.24);
    osc.connect(envelope);
    envelope.connect(music.bus);
    osc.start(when);
    osc.stop(when + 0.28);
  }

  function playCue(kind) {
    if (!music || !music.playing) return;
    try {
      const now = music.ctx.currentTime + 0.02;
      if (kind === 'quest' || kind === 'battle') {
        drumVoice(now, 0.12);
        drumVoice(now + 0.16, 0.075);
        pluckVoice(MUSIC_SCALE[5], now + 0.04, 0.09, 0);
      } else if (kind === 'scene') {
        drumVoice(now, 0.08);
        pluckVoice(MUSIC_SCALE[2], now + 0.12, 0.06, 0);
      } else {
        pluckVoice(MUSIC_SCALE[3], now + 0.06, 0.05, 0);
      }
    } catch {
      /* Audio is optional. */
    }
  }

  function musicMoodFor(run) {
    if (!run) return 'life';
    if (run.pendingScene) return 'scene';
    if (run.pendingChoice && run.pendingChoice.kind === 'quest') return 'battle';
    return 'life';
  }

  function setMusicMood(mood) {
    if (!music || !mood) return;
    if (music.mood === mood) return;
    music.mood = mood;
    if (music.playing) playCue(mood);
  }

  function updateMusicMood(run) {
    setMusicMood(musicMoodFor(run));
  }

  function scheduleMusicBar(index, when) {
    if (!music) return;
    const chord = MUSIC_PROGRESSION[index % MUSIC_PROGRESSION.length];
    chord.notes.forEach((freq, noteIndex) => {
      padVoice(freq, when + noteIndex * 0.03, MUSIC_BAR + 1.2, 0.024, noteIndex % 2 === 0 ? -0.16 : 0.16, noteIndex % 2 === 0 ? -3 : 3);
    });
    bassVoice(chord.bass, when, MUSIC_BAR * 0.9);
    MUSIC_ARPEGGIO.forEach((noteIndex, step) => {
      const freq = chord.notes[noteIndex % chord.notes.length];
      pluckVoice(freq, when + step * (MUSIC_BEAT / 2), 0.034, step % 2 === 0 ? -0.2 : 0.2);
    });
    if (music.mood === 'battle' || music.mood === 'scene') {
      for (let step = 0; step < 8; step += 1) {
        drumVoice(when + step * (MUSIC_BEAT / 2), step % 4 === 0 ? 0.085 : step % 2 === 0 ? 0.045 : 0.028);
      }
    }
    const pattern = MUSIC_PATTERNS[index % MUSIC_PATTERNS.length];
    pattern.forEach((noteIndex, step) => {
      if (noteIndex < 0) return;
      pluckVoice(MUSIC_SCALE[noteIndex], when + 0.48 + step * 0.68, 0.075, step % 2 === 0 ? -0.1 : 0.1);
    });
  }

  function pumpMusic() {
    if (!music || !music.playing) return;
    try {
      const now = music.ctx.currentTime;
      if (music.nextBar < now - MUSIC_BAR) music.nextBar = now + 0.2;
      while (music.nextBar < now + 1.2) {
        scheduleMusicBar(music.barIndex, music.nextBar);
        music.nextBar += MUSIC_BAR;
        music.barIndex += 1;
      }
    } catch {
      stopMusic();
    }
  }

  function startMusic() {
    if (!state.musicOn) return false;
    const audio = initMusic();
    if (!audio) return false;
    try {
      if (audio.ctx.state !== 'running') audio.ctx.resume().catch(() => {});
      if (audio.playing) return true;
      audio.mood = musicMoodFor(state.run);
      if (audio.stopped) {
        const nextBus = audio.ctx.createGain();
        nextBus.gain.value = 0.0001;
        nextBus.connect(audio.master);
        nextBus.connect(audio.convolver);
        nextBus.connect(audio.delay);
        audio.noiseGain.connect(nextBus);
        audio.bus = nextBus;
        audio.stopped = false;
      }
      audio.playing = true;
      audio.barIndex = 0;
      audio.nextBar = audio.ctx.currentTime + 0.2;
      audio.bus.gain.cancelScheduledValues(audio.ctx.currentTime);
      audio.bus.gain.setValueAtTime(0.0001, audio.ctx.currentTime);
      audio.bus.gain.exponentialRampToValueAtTime(0.82, audio.ctx.currentTime + 1.8);
      pumpMusic();
      audio.timer = setInterval(pumpMusic, 250);
      return true;
    } catch {
      return false;
    }
  }

  function stopMusic() {
    if (!music) return;
    music.playing = false;
    if (music.timer) {
      clearInterval(music.timer);
      music.timer = null;
    }
    const now = music.ctx.currentTime;
    music.bus.gain.cancelScheduledValues(now);
    music.bus.gain.setValueAtTime(Math.max(0.0001, music.bus.gain.value), now);
    music.bus.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);
    music.stopped = true;
  }

  function ensureMusic() {
    if (!state.musicOn) return;
    if (!music || !music.playing) startMusic();
    else if (music.ctx.state !== 'running') music.ctx.resume().catch(() => {});
  }

  function toggleMusic() {
    state.musicOn = !state.musicOn;
    if (state.musicOn) {
      if (!startMusic()) {
        state.musicOn = false;
        showToast('当前浏览器不支持音乐播放');
      }
    } else {
      stopMusic();
    }
    try {
      window.localStorage.setItem(MUSIC_KEY, state.musicOn ? '1' : '0');
    } catch {
      /* Private mode can refuse persistence. */
    }
    render();
  }

  function musicButton() {
    const on = state.musicOn;
    return '<button class="music-btn" data-action="toggle-music" data-on="' + (on ? 'true' : 'false') + '" aria-label="' + (on ? '关闭音乐' : '开启音乐') + '" title="' + (on ? '轻触关闭音乐' : '轻触播放音乐') + '">'
      + '<span class="music-glyph">♫</span><span class="music-label">' + (on ? '音乐开' : '音乐关') + '</span></button>';
  }

  function scrollAfterRender() {
    const mode = state.pendingScroll;
    state.pendingScroll = 'preserve';
    requestAnimationFrame(() => {
      if (mode === 'top') {
        window.scrollTo(0, 0);
      } else if (mode === 'bottom') {
        window.scrollTo(0, document.documentElement.scrollHeight);
      }
    });
  }

  function render() {
    const html = state.view === 'home'
      ? homeHtml()
      : state.view === 'setup'
        ? setupHtml()
        : gameHtml();
    let overlay = ''
    if (state.replay) overlay = replayHtml()
    else if (state.run && state.run.pendingScene) overlay = sceneHtml()
    else if (state.run && state.run.pendingChoice) overlay = choiceHtml()
    app.innerHTML = html + overlay
    document.body.classList.toggle('modal-open', Boolean(state.replay || (state.run && (state.run.pendingScene || state.run.pendingChoice))))
    updateMusicMood(state.run)
    scrollAfterRender();
  }

  function worldPills() {
    return WORLDS.map(world => '<span class="world-pill" data-world="' + world.id + '"><i>' + (WORLD_GLYPHS[world.id] || '◆') + '</i>' + esc(world.name) + '</span>').join('');
  }

  function achievementCard(item, unlocked) {
    const kind = COMEDY_IDS.has(item.id) ? 'comedy' : item.id.indexOf('chaos_') === 0 ? 'chaos' : 'collection';
    const mark = unlocked ? (kind === 'comedy' ? '✦' : kind === 'chaos' ? '✧' : '◆') : '？';
    return '<div class="ach-card" data-kind="' + kind + '" data-unlocked="' + (unlocked ? 'true' : 'false') + '">'
      + '<span class="ach-mark">' + mark + '</span>'
      + '<div><strong>' + esc(unlocked ? item.title : '未解锁') + '</strong>'
      + '<p>' + esc(unlocked ? item.desc : '再活出一点节目效果，就能看见它。') + '</p></div>'
      + '</div>';
  }

  function setPlayMode(mode) {
    if (mode !== 'interactive' && mode !== 'text') return;
    state.playMode = mode;
    try { window.localStorage.setItem(PLAY_MODE_KEY, mode); } catch { /* Private mode can refuse persistence. */ }
    render();
  }

  function homeHtml() {
    const bucket = modeRecord(state.record, state.playMode);
    const unlockedAch = new Set(bucket.unlockedAchievements || []);
    const achCount = ALL_ACHIEVEMENTS.filter(item => unlockedAch.has(item.id)).length;
    const achPct = Math.round((achCount / Math.max(1, ACHIEVEMENT_TOTAL)) * 100);
    const endingCount = Array.isArray(bucket.unlocked) ? bucket.unlocked.length : 0;
    const replay = bucket.replay;
    const achPageSize = 60
    const achPageCount = Math.max(1, Math.ceil(ACHIEVEMENT_TOTAL / achPageSize))
    const achPage = Math.min(Math.max(0, state.achPage || 0), achPageCount - 1)
    const list = state.showAllAchievements
      ? ALL_ACHIEVEMENTS.slice(achPage * achPageSize, (achPage + 1) * achPageSize)
      : ALL_ACHIEVEMENTS.slice(0, 8)
    const achHtml = list.map(item => achievementCard(item, unlockedAch.has(item.id))).join('')
    const legacyHtml = state.legacy
      ? '<div class="legacy-note">继承待用 · ' + esc(state.legacy.label || '上一世的天赋') + ' +' + (state.legacy.amount || 2) + ' · 初始资源 +' + (state.legacy.wealth || 10) + '</div>'
      : '';
    const replayHtml = replay
      ? '<div class="replay-card">'
        + '<div class="replay-grade">' + esc(replay.grade || 'D') + '</div>'
        + '<div class="replay-copy"><strong>' + esc(replay.title || '一段已经写完的人生') + '</strong>'
        + '<p>' + esc((replay.worldName || '某个世界') + ' · ' + (replay.age || 0) + ' 岁 · ' + (replay.score || 0) + ' 分') + '</p></div>'
        + '<button class="btn btn-ghost btn-small" data-action="open-last-replay">回放</button>'
        + '</div>'
      : '<div class="replay-empty">还没有可以回放的人生。<br>完成第一段人生后，这里会留下最后一世的记录。</div>';

    return '<div class="screen no-bottom">'
      + '<header class="hero">'
      + '<div class="hero-top"><div class="eyebrow">LIFE RESTART / IPHONE</div>' + musicButton() + '</div>'
      + '<h1>人生<em>重开</em></h1>'
      + '<p class="sub">' + WORLDS.length + ' 个世界，' + TOTAL_ENDINGS + ' 个结局，' + ACHIEVEMENT_TOTAL + ' 个成就。先看看你留下过什么，再决定这一次从哪里开始。</p>'
      + legacyHtml
      + '<div class="hero-actions">'
      + '<button class="btn btn-primary" data-action="start-setup">开始新的一生 <span aria-hidden="true">→</span></button>'
      + (replay ? '<button class="btn btn-ghost" data-action="open-last-replay">回放上一生</button>' : '')
      + '</div>'
      + '<div class="play-mode-switch" role="group" aria-label="游戏模式">'
      + '<button data-action="set-mode" data-mode="interactive" data-active="' + (state.playMode === 'interactive' ? 'true' : 'false') + '"><b>互动模式</b><span>在命运岔路停下来，自己选</span></button>'
      + '<button data-action="set-mode" data-mode="text" data-active="' + (state.playMode === 'text' ? 'true' : 'false') + '"><b>纯文本模式</b><span>自动替你选，只负责读故事</span></button>'
      + '</div>'
      + '<p class="play-mode-hint">' + (state.playMode === 'text' ? '纯文本模式：不再弹出选择框，命运会替你掷骰。' : '互动模式：遇到岔路会停下来，选项由你的属性决定。') + ' 结局、成就与回放按模式独立记录。' + '</p>'
      + '<div class="stat-grid">'
      + '<div class="stat"><b>' + (bucket.runs || 0) + '</b><span>活过</span></div>'
      + '<div class="stat"><b>' + (bucket.best || 0) + '</b><span>最高评分</span></div>'
      + '<div class="stat"><b>' + endingCount + ' / ' + TOTAL_ENDINGS + '</b><span>结局图鉴</span></div>'
      + '<div class="stat"><b>' + achCount + ' / ' + ACHIEVEMENT_TOTAL + '</b><span>成就</span></div>'
      + '</div>'
      + '<div class="world-pills">' + worldPills() + '</div>'
      + '</header>'
      + '<section class="panel">'
      + '<div class="panel-head"><div><span class="kicker">ACHIEVEMENTS</span><h2>成就收藏</h2></div><em>' + achCount + ' / ' + ACHIEVEMENT_TOTAL + '</em></div>'
      + '<div class="panel-progress"><i style="width:' + achPct + '%"></i></div>'
      + '<div class="ach-list' + (state.showAllAchievements ? ' scroll' : '') + '">' + achHtml + '</div>'
      + (state.showAllAchievements
        ? '<div class="ach-pager"><button class="btn btn-ghost btn-small" data-action="ach-prev"' + (achPage <= 0 ? ' disabled' : '') + '>上一页</button><span>第 ' + (achPage + 1) + ' / ' + achPageCount + ' 页</span><button class="btn btn-ghost btn-small" data-action="ach-next"' + (achPage >= achPageCount - 1 ? ' disabled' : '') + '>下一页</button></div>'
        : '')
      + '<div class="ach-actions"><button class="btn btn-ghost btn-small btn-block" data-action="toggle-ach">' + (state.showAllAchievements ? '收起成就' : '查看全部 ' + ACHIEVEMENT_TOTAL + ' 个成就') + '</button></div>'
      + '</section>'
      + '<section class="panel">'
      + '<div class="panel-head"><div><span class="kicker">LAST LIFE</span><h2>上一世回放</h2></div>' + (replay ? '<em>' + replay.age + ' 岁</em>' : '') + '</div>'
      + replayHtml
      + '<p class="panel-note">回放只读取本机记录，不会改变已经发生的结局。</p>'
      + '</section>'
      + '<footer class="footnote"><span>记录保存在本机浏览器</span><span>' + TOTAL_ENDINGS + ' ENDINGS · ' + ACHIEVEMENT_TOTAL + ' ACHIEVEMENTS</span></footer>'
      + '</div>';
  }

  function setupHtml() {
    const world = currentWorld();
    const selected = selectedTalents();
    const remaining = remainingPoints();
    const selectedCount = selected.length;
    const legacyHtml = state.legacy
      ? '<div class="mode-banner" data-active="true"><span class="mode-mark">继</span><div class="mode-copy"><strong>继承模式</strong><p>来自「' + esc(state.legacy.sourceWorld || '上一世') + '」的 ' + esc(state.legacy.label || '天赋') + ' <em>+' + (state.legacy.amount || 2) + '</em> · 初始资源 <em>+' + (state.legacy.wealth || 10) + '</em></p></div><button class="btn btn-ghost btn-small" data-action="clear-legacy">改为重开</button></div>'
      : '<div class="mode-banner"><span class="mode-mark">重</span><div class="mode-copy"><strong>重开模式</strong><p>从零开始，不带走上一世的任何东西。</p></div></div>';

    const worlds = WORLDS.map(item => '<button class="world-chip" data-action="choose-world" data-world="' + item.id + '" data-active="' + (item.id === world.id ? 'true' : 'false') + '">'
      + '<i>' + (WORLD_GLYPHS[item.id] || '◆') + '</i><b>' + esc(item.name) + '</b><span>' + esc(item.tagline) + '</span></button>').join('');
    const loreHtml = world.lore
      ? '<div class="mode-banner" data-active="true"><span class="mode-mark">' + esc(world.loreMark || (WORLD_GLYPHS[world.id] || '世')) + '</span><div class="mode-copy"><strong>' + esc(world.loreTitle || (world.id === 'cultivation' ? '凡人流的规矩' : world.name + '的规矩')) + '</strong><p>' + esc(world.lore) + '</p></div></div>'
      : '';
    const realmGuide = world.id === 'cultivation'
      ? '<div class="realm-guide"><b>寿元阶梯</b> · 凡人约百岁 / 炼气120 / 筑基250 / 结丹500 / 元婴1000 / 化神2000 / 炼虚3000 / 合体5000 / 大乘1万 / 渡劫1.2万</div>'
      : '';
    const growthGuide = '<div class="growth-guide">属性上限 40 · 出生仍分配 15 点 · 游戏内成长收益小幅提升 · 遇到岔路时按当前属性解锁选项</div>';
    const gender = GENDER_MAP[state.draft.gender] ? state.draft.gender : 'male';
    const genderHtml = '<div class="gender-row"><div class="gender-copy"><b>这一世的性别</b><span>每次人生随机；也可以自己选。</span></div><div class="gender-options">'
      + GENDERS.map(item => '<button class="gender-btn" data-action="set-gender" data-gender="' + item.key + '" data-active="' + (item.key === gender ? 'true' : 'false') + '">' + item.label + '</button>').join('')
      + '</div></div>';

    const attrs = world.attrs.map(attr => {
      const value = state.draft.alloc[attr.key] || 0;
      const segments = Array.from({ length: ALLOC_MAX }, (_, index) => '<i data-on="' + (index < value ? 'true' : 'false') + '"></i>').join('');
      return '<div class="attr-row" data-key="' + attr.key + '">'
        + '<span class="attr-icon">' + esc(attr.name.slice(0, 1)) + '</span>'
        + '<div class="attr-main"><div class="attr-line"><b>' + esc(attr.name) + '</b><small>' + esc(attr.en) + '</small><em>' + value + ' / ' + ALLOC_MAX + '</em></div>'
        + '<div class="attr-desc">' + esc(attr.desc) + '</div>'
        + '<div class="segments">' + segments + '</div></div>'
        + '<div class="stepper"><button class="step-btn" data-action="alloc" data-key="' + attr.key + '" data-dir="-1" ' + (value <= 0 ? 'disabled' : '') + '>−</button>'
        + '<button class="step-btn" data-action="alloc" data-key="' + attr.key + '" data-dir="1" ' + (remaining <= 0 || value >= ALLOC_MAX ? 'disabled' : '') + '>+</button></div>'
        + '</div>';
    }).join('');

    const talents = state.draft.choices.map(talent => {
      const isSelected = state.draft.selectedIds.includes(talent.id);
      const locked = selectedCount >= TALENT_PICK_COUNT && !isSelected;
      return '<button class="talent" data-action="toggle-talent" data-id="' + talent.id + '" data-rarity="' + esc(talent.rarity) + '" data-selected="' + (isSelected ? 'true' : 'false') + '" data-locked="' + (locked ? 'true' : 'false') + '" ' + (locked ? 'disabled' : '') + '>'
        + '<span class="talent-top"><span class="rarity">' + esc(talent.rarity) + '</span><span class="pick">' + (isSelected ? '已选' : locked ? '已满' : '选择') + '</span></span>'
        + '<b>' + esc(talent.name) + '</b>'
        + '<span class="talent-desc">' + esc(talent.desc) + '</span>'
        + '</button>';
    }).join('');

    const slots = Array.from({ length: TALENT_PICK_COUNT }, (_, index) => {
      const talent = selected[index];
      return '<span class="slot" data-filled="' + (talent ? 'true' : 'false') + '" data-rarity="' + (talent ? esc(talent.rarity) : '') + '">'
        + '<i class="slot-dot"></i>' + String(index + 1).padStart(2, '0') + ' · ' + (talent ? esc(talent.name) : '待选') + '</span>';
    }).join('');

    const hint = remaining > 0
      ? '还有 ' + remaining + ' 点没有分配。'
      : selectedCount < TALENT_PICK_COUNT
        ? '还需要选择 ' + (TALENT_PICK_COUNT - selectedCount) + ' 个天赋。'
        : '十五点已分完，五张命运签也已落定。';
    const talentPct = Math.round((selectedCount / TALENT_PICK_COUNT) * 100);

    return '<div class="screen setup">'
      + '<div class="topbar"><div class="topbar-left"><button class="icon-btn" data-action="home" aria-label="返回开始界面">‹</button><div class="topbar-copy"><b>准备这一生</b><span>' + esc(world.name) + ' · 十五点投胎 · 十选五</span></div></div><div class="topbar-actions">' + musicButton() + '<span class="mode-chip" data-mode="' + state.playMode + '">' + (state.playMode === 'text' ? '纯文本' : '互动') + '</span><span class="mode-chip">' + (state.legacy ? '继承' : '重开') + '</span></div></div>'
      + '<div class="setup-head"><div><h1>投胎之前</h1><p>把十五点押在你想成为的样子上。</p></div><span class="mode-chip">' + esc(world.en) + '</span></div>'
      + '<div class="world-scroll">' + worlds + '</div>'
      + genderHtml
      + loreHtml
      + realmGuide
      + growthGuide
      + legacyHtml
      + '<section class="card points-card">'
      + '<div class="card-head"><div><h2>分配属性</h2><p>' + esc(world.description) + '</p></div><div class="points-left">' + remaining + '<span>剩余点数</span></div></div>'
      + '<div style="margin-top:5px">' + attrs + '</div>'
      + '<div class="mini-actions"><button class="btn btn-ghost btn-small" data-action="random-alloc">随机分配</button><button class="btn btn-ghost btn-small" data-action="clear-alloc" ' + (remaining === TOTAL_POINTS ? 'disabled' : '') + '>清空</button></div>'
      + '</section>'
      + '<section class="card">'
      + '<div class="card-head"><div><h2>天赋池 · 十选五</h2><p>点击选择或取消，选满五个后其余会锁定。</p></div><span class="talent-count">' + selectedCount + ' / ' + TALENT_PICK_COUNT + '</span></div>'
      + '<div class="talent-tools"><p>每局可刷新 ' + TALENT_REFRESH_LIMIT + ' 次，刷新会清空已选。</p><button class="btn btn-ghost btn-small" data-action="reroll" ' + (state.draft.refreshes <= 0 ? 'disabled' : '') + '>刷新 · ' + state.draft.refreshes + '</button></div>'
      + '<div class="talent-progress"><i style="width:' + talentPct + '%"></i></div>'
      + '<div class="talent-grid">' + talents + '</div>'
      + '<div class="rarity-legend"><span class="rarity-key" data-rarity="传说">传说</span><span class="rarity-key" data-rarity="奇">奇</span><span class="rarity-key" data-rarity="良">良</span><span class="rarity-key" data-rarity="凡">凡</span></div>'
      + '</section>'
      + '<section class="loadout"><div class="loadout-head"><strong>已选命运签</strong><span>' + selectedCount + ' / ' + TALENT_PICK_COUNT + '</span></div><div class="loadout-slots">' + slots + '</div></section>'
      + '<div class="startbar"><div class="startbar-copy"><b>' + (canStart() ? '可以开始了' : '还不能开始') + '</b><span>' + hint + '</span></div><button class="btn btn-primary" data-action="start-life" ' + (canStart() ? '' : 'disabled') + '>开始</button></div>'
      + '</div>';
  }

  function gradeOf(run) {
    return run.ending ? run.ending.grade : { grade: 'D', label: '微光' };
  }

  function statsHtml(run) {
    const world = worldOf(run);
    const health = Math.max(0, Math.min(100, run.health));
    const mood = Math.max(0, Math.min(100, run.mood));
    const wealthText = world.vitals.wealth + ' ' + formatMoney(run, run.wealth);
    const lifespanPct = run.worldId === 'cultivation'
      ? run.flags.ascended
        ? 100
        : Math.min(100, Math.max(0, (run.age / Math.max(1, run.deathAge)) * 100))
      : 0;
    const lifespanText = run.flags.ascended || run.deathAge >= 99999
      ? '飞升'
      : run.deathAge >= 10000
        ? (run.deathAge / 10000).toFixed(1).replace(/\.0$/, '') + '万'
        : String(Math.round(run.deathAge));
    const lifespanHtml = run.worldId === 'cultivation'
      ? '<div class="lifespan-row"><span>寿元</span><div class="track"><i style="width:' + lifespanPct + '%"></i></div><b>' + Math.round(run.age) + ' / ' + lifespanText + '</b></div>'
      : '';
    return '<div class="game-stats">'
      + '<div class="statbar"><div class="statbar-head"><span>' + esc(world.vitals.health) + '</span><b>' + Math.round(health) + '</b></div><div class="track"><i style="width:' + health + '%" data-low="' + (health < 30 ? 'true' : 'false') + '"></i></div></div>'
      + '<div class="statbar"><div class="statbar-head"><span>' + esc(world.vitals.mood) + '</span><b>' + Math.round(mood) + '</b></div><div class="track"><i style="width:' + mood + '%" data-low="' + (mood < 30 ? 'true' : 'false') + '"></i></div></div>'
      + '<div class="statbar"><div class="statbar-head"><span>' + esc(wealthText) + '</span><b>' + esc(wealthLabel(run, run.wealth)) + '</b></div><div class="track"><i style="width:100%"></i></div></div>'
      + lifespanHtml
      + '</div>';
  }

    function realmText(run) {
      if (run.worldId === 'cultivation') return run.flags.realmName || '凡人';
      if (run.worldId === 'starship') {
        if (run.flags.captain) return '舰长';
        if (run.flags.pilot) return '领航员';
        if (run.flags.engineer) return '工程师';
        if (run.flags.medic) return '医官';
        return (worldOf(run).stages[run.stage] || {}).label || '舰员';
      }
      if (run.worldId === 'jianghu') {
        if (run.flags.sectMaster) return '掌门';
        if (run.flags.swordHeart) return '剑客';
        if (run.flags.doctor) return '医者';
        if (run.flags.teacher) return '教习';
        return (worldOf(run).stages[run.stage] || {}).label || '江湖人';
      }
      return jobLabel(run);
    }

    function equipmentLabel(run) {
      const f = run.flags || {};
      if (run.worldId === 'modern') {
        if (f.house) return '房产证';
        if (run.wealth >= 100) return '车钥匙';
        if (f.scholar) return '旧书';
        return '手机';
      }
      if (run.worldId === 'cultivation') {
        if (f.swordHeart) return '本命剑';
        if (f.alchemist) return '丹炉';
        if (f.sect) return '宗门令牌';
        return '储物袋';
      }
      if (run.worldId === 'wasteland') {
        if (f.radioContact) return '旧电台';
        if (f.beastfriend) return '猎犬';
        if (f.mutant) return '抗辐射针';
        return '防毒面具';
      }
      if (run.worldId === 'magic') {
        if (f.dragon) return '幼龙';
        if (f.familiar) return '使魔';
        if (f.professor) return '教授徽章';
        return '魔杖';
      }
      if (run.worldId === 'cyber') {
        if (f.digitalGhost) return '幽灵接口';
        if (f.uploaded) return '云端备份';
        if (f.chrome && f.chrome !== '原装身体') return '义体';
        return '二手终端';
      }
      if (run.worldId === 'starship') {
        if (f.captain) return '舰长密钥';
        if (f.pilot) return '航行徽章';
        if (f.engineer) return '维修臂甲';
        return '制式制服';
      }
      if (run.worldId === 'jianghu') {
        if (f.swordHeart) return '佩剑';
        if (f.sect) return '门派令牌';
        if (f.doctor) return '药箱';
        return '斗笠';
      }
      return '随身物';
    }

    function avatarSvg(run) {
      const palettes = {
        modern: ['#f1ded2', '#8b5a45', '#b8754e'],
        cultivation: ['#e1ebe3', '#4f6f5c', '#608b76'],
        wasteland: ['#eee1c9', '#7f5f3b', '#a9824f'],
        magic: ['#e6e1f4', '#5f4f91', '#7d6bc0'],
        cyber: ['#dfeef2', '#356473', '#4f8faa'],
        starship: ['#e1e7f3', '#4f638c', '#6f86b8'],
        jianghu: ['#f0e1d8', '#7d4436', '#a45f4a'],
      };
      const palette = palettes[run.worldId] || palettes.modern;
      const old = run.age >= 65;
      const child = run.age < 14;
      const hair = old ? '#c9c4b8' : child ? '#5b4638' : '#3c3028';
      const skin = '#f0c9a7';
      const eye = palette[1];
      const woman = run.gender === 'female';
      const hairPath = woman
        ? '<path d="M34 58c0-19 10-31 26-31s26 12 26 31v15c-5-9-8-18-8-27-8 5-17 7-31 5-2 8-5 15-9 20z" fill="' + hair + '"/><path d="M38 64c-2 16 2 26 5 32h-9c-2-11-2-22 4-32zM82 64c2 16-2 26-5 32h9c2-11 2-22-4-32z" fill="' + hair + '"/>'
        : '<path d="M36 55c0-16 10-27 24-27s24 11 24 27c0 5-2 9-4 12-3-9-9-14-20-14s-17 5-20 14c-2-3-4-7-4-12z" fill="' + hair + '"/>';
      const accessory = run.worldId === 'jianghu'
        ? '<path d="M91 34l6 15-5 2-7-14z" fill="' + palette[2] + '"/><path d="M93 37l2 6" stroke="#f6e5c9" stroke-width="1.4"/>'
        : run.worldId === 'magic'
          ? '<path d="M94 31v21" stroke="' + palette[2] + '" stroke-width="3" stroke-linecap="round"/><circle cx="94" cy="28" r="4" fill="' + palette[2] + '"/>'
          : run.worldId === 'cyber'
            ? '<path d="M79 52h22" stroke="' + palette[2] + '" stroke-width="3" stroke-linecap="round"/><circle cx="88" cy="52" r="4" fill="#bff1ff"/>'
            : run.worldId === 'starship'
              ? '<rect x="82" y="53" width="14" height="5" rx="2" fill="' + palette[2] + '"/>'
              : '';
      return '<svg viewBox="0 0 120 120" role="img" aria-label="人物形象">'
        + '<rect width="120" height="120" rx="14" fill="' + palette[0] + '"/>'
        + '<circle cx="60" cy="64" r="42" fill="rgba(255,255,255,0.28)"/>'
        + '<path d="M26 112c3-22 14-33 34-33s31 11 34 33z" fill="' + palette[2] + '"/>'
        + '<path d="M52 80h16v12c-4 4-12 4-16 0z" fill="' + skin + '"/>'
        + '<ellipse cx="60" cy="58" rx="23" ry="27" fill="' + skin + '"/>'
        + hairPath
        + '<circle cx="51" cy="59" r="2.2" fill="' + eye + '"/><circle cx="69" cy="59" r="2.2" fill="' + eye + '"/>'
        + '<path d="M46 51c2-2 5-2 7-1M67 50c2-1 5-1 7 1" stroke="#4a3326" stroke-width="1.5" stroke-linecap="round" fill="none"/>'
        + (old ? '<path d="M43 58h12v7H43zM65 58h12v7H65z" stroke="#6b6257" stroke-width="1.2" fill="none"/><path d="M55 61h10" stroke="#6b6257" stroke-width="1.2"/>' : '')
        + '<path d="M54 71c3 2.4 9 2.4 12 0" stroke="#9d5b4a" stroke-width="1.8" stroke-linecap="round" fill="none"/>'
        + accessory
        + '</svg>';
    }

    function avatarHtml(run) {
      if (!run) return '';
      const world = worldOf(run);
      const stage = world.stages[run.stage] || world.stages.child || { label: '' };
      const genderLabel = run.genderLabel || (run.gender === 'female' ? '女' : '男');
      const talents = (run.talents || []).slice(0, 2).map(item => item.name);
      const extraTalents = Math.max(0, (run.talents || []).length - talents.length);
      const talentText = talents.length ? talents.join(' · ') + (extraTalents ? ' +' + extraTalents : '') : '无';
      const partner = run.flags.partnerName
        ? '伴侣 · ' + run.flags.partnerName + (run.flags.partnerLost ? '（已故）' : '')
        : run.flags.partnerLost
          ? '伴侣已远行'
          : '还没有遇见伴侣';
      const childText = (run.flags.children || 0) > 0 ? ' · ' + run.flags.children + ' 个孩子' : '';
      return '<section class="avatar-card" data-world="' + esc(run.worldId) + '" data-gender="' + esc(run.gender || 'male') + '">'
        + '<div class="avatar-art">' + avatarSvg(run) + '</div>'
        + '<div class="avatar-copy"><div class="avatar-head"><b>' + esc(genderLabel) + ' · ' + run.age + ' 岁</b><span>' + esc(realmText(run)) + '</span></div>'
        + '<p class="avatar-sub">' + esc(partner) + esc(childText) + ' · ' + esc(stage.label) + '</p>'
        + '<div class="avatar-tags"><span class="avatar-tag">性别 ' + esc(genderLabel) + '</span><span class="avatar-tag">' + esc(realmText(run)) + '</span><span class="avatar-tag">天赋 ' + esc(talentText) + '</span><span class="avatar-tag">装备 ' + esc(equipmentLabel(run)) + '</span></div></div>'
        + '</section>';
    }

  function deltaHtml(entry) {
    if (!Array.isArray(entry.deltas) || entry.deltas.length === 0) return '';
    return '<div class="deltas">' + entry.deltas.map(delta => '<span class="delta" data-kind="' + esc(delta.kind || '') + '">' + esc(delta.label) + ' ' + (delta.value > 0 ? '+' : '') + delta.value + (delta.money ? (delta.unit || '') : '') + '</span>').join('') + '</div>';
  }

  function logHtml(run) {
    let html = '';
    for (const entry of run.log) {
      if (entry.kind === 'chapter') {
        html += '<div class="chapter-entry">' + esc(entry.text) + '<small>' + entry.age + ' 岁</small></div>';
        continue;
      }
      if (entry.kind === 'birth') {
        html += '<div class="birth-entry">' + esc(entry.text) + '</div>';
        continue;
      }
      if (entry.kind === 'death') {
        html += '<div class="death-entry"><small>终局 · ' + esc(entry.cause || '') + '</small>' + esc(entry.text) + '</div>';
        continue;
      }
      const tag = entry.isChoice ? (entry.autoChoice ? '命运选择 · ' : '抉择 · ') + (entry.choiceLabel || '命运岔路') : entry.isPartner ? '相伴' : entry.isTwist ? '意外' : entry.milestone ? '人生节点' : '';
      html += '<div class="entry" data-tone="' + esc(entry.tone || 'normal') + '">'
        + '<div class="entry-age">' + entry.age + ' 岁' + (entry.span ? '<small>+' + entry.span + '年</small>' : '') + '</div>'
        + '<div class="entry-body">' + (tag ? '<span class="entry-tag ' + (entry.isTwist ? 'twist' : entry.isChoice ? 'choice' : entry.isPartner ? 'partner' : '') + '">' + tag + '</span>' : '')
        + '<div class="entry-text">' + esc(entry.text) + '</div>' + deltaHtml(entry) + '</div></div>';
    }
    return html;
  }

  function endingHtml(run) {
    if (!run.ending) return '';
    const world = worldOf(run);
    const ending = run.ending;
    const grade = gradeOf(run);
    const bestAttr = world.attrs.slice().sort((a, b) => (run.attrs[b.key] || 0) - (run.attrs[a.key] || 0))[0];
    const stats = [
      [world.dossier[0], educationLabel(run)],
      [world.dossier[1], jobLabel(run)],
      [world.dossier[2], familyLine(run)],
      ['最终' + world.vitals.wealth, formatMoney(run, run.wealth)],
    ].map(pair => '<div class="ending-stat"><span>' + esc(pair[0]) + '</span><b>' + esc(pair[1]) + '</b></div>').join('');
    const orderedAchievements = ending.achievements.slice().sort((a, b) => (b.ending ? 1 : 0) - (a.ending ? 1 : 0) || (b.fun ? 1 : 0) - (a.fun ? 1 : 0));
    const shownAchievements = orderedAchievements.slice(0, 12);
    const hiddenAchievements = Math.max(0, orderedAchievements.length - shownAchievements.length);
    const achievements = shownAchievements.map(item => {
      const kind = item.fun ? 'comedy' : item.id.indexOf('chaos_') === 0 ? 'chaos' : item.ending ? 'ending' : item.persistent ? 'collection' : 'life';
      return '<span class="ach-chip" data-kind="' + kind + '" data-fun="' + (item.fun ? 'true' : 'false') + '">' + esc(item.label) + '</span>';
    }).join('') + (hiddenAchievements > 0 ? '<span class="ach-chip ach-more" data-kind="collection">+' + hiddenAchievements + ' 项</span>' : '');
    return '<section class="ending">'
      + '<div class="ending-top"><div><span class="ending-kicker">ENDING · ' + esc(world.name) + (ending.comedy ? ' · 喜剧' : '') + '</span><h2>' + esc(ending.title) + '</h2></div><div class="score-ring"><b>' + ending.score + '</b><span>SCORE</span></div></div>'
      + '<p class="ending-desc">' + esc(ending.description) + '</p>'
      + '<div class="grade-line"><span class="grade-badge" data-grade="' + esc(grade.grade) + '">' + esc(grade.grade) + '</span><strong>' + esc(grade.label) + '</strong><span class="grade-cause">终局：' + esc(run.cause) + '</span></div>'
      + '<div class="ending-stats">' + stats + '</div>'
      + '<div class="ending-ach">' + achievements + '</div>'
      + '<div class="ending-actions">'
      + '<button class="btn btn-primary" data-action="inherit">继承模式</button>'
      + '<button class="btn btn-ghost" data-action="restart">重开模式</button>'
      + '<button class="btn btn-ghost" data-action="open-replay">回放这一生</button>'

    const death = !run.alive;
    const nextYears = run.worldId === 'cultivation' ? cultivationYears(run) : 1;

  function choiceHtml() {
    const run = state.run;
    const pending = run && run.pendingChoice;
    if (!pending) return '';
    const isQuest = pending.kind === 'quest';
    const options = pending.options.map(option => {
      const requirements = choiceRequirementEntries(run, option);
      const available = canChooseOption(run, option);
      const reqHtml = requirements.length > 0
        ? '<div class="choice-reqs">' + requirements.map(item => '<span class="choice-req" data-ok="' + (item.ok ? 'true' : 'false') + '">' + esc(item.text) + '</span>').join('') + '</div>'
        : '';
      return '<button class="choice-option" type="button" data-action="choose-option" data-id="' + esc(option.id) + '" data-available="' + (available ? 'true' : 'false') + '" ' + (available ? '' : 'disabled') + '>'
        + '<span class="choice-option-top"><b>' + esc(option.label) + '</b><em>' + (available ? '选择' : '未达到') + '</em></span>'
        + '<p>' + esc(option.desc) + '</p>'
        + reqHtml
        + (option.risk ? '<span class="choice-risk">风险：' + esc(option.risk) + '</span>' : '')
        + (!available ? '<span class="choice-locked">属性或资源不足，暂时无法选择。</span>' : '')
        + '</button>';

    const toolbar = isQuest
      ? '<div class="quest-toolbar"><span>可刷新 ' + (pending.refreshLeft || 0) + ' 次 · 任务会消耗这一年的时间</span><button data-action="refresh-quest" ' + ((pending.refreshLeft || 0) <= 0 ? 'disabled' : '') + '>刷新任务</button></div>'

      + toolbar
      + '<div class="choice-options">' + options + '</div>'
      + '<p class="choice-note">' + (isQuest ? '任务有成功与失败两种结果。刷新会换一批任务，但不会增加年份。' : '选择会立刻改变这一生。灰掉的项目代表当前属性或资源还不够。') + '</p>'

  function sceneHtml() {
    const run = state.run;
    const scene = run && run.pendingScene;
    if (!scene) return '';
    return '<div class="modal scene-modal" role="presentation">'
      + '<section class="scene-sheet" role="dialog" aria-modal="true" aria-label="' + esc(scene.title) + '">'
      + '<div class="scene-frame"><div class="scene-art">' + sceneSvg(scene.art) + '</div><div class="scene-scan"></div><span class="scene-stamp">' + esc(scene.stamp || 'SCENE') + '</span></div>'
      + '<div class="scene-caption"><span class="scene-kicker">' + esc(scene.kicker) + '</span><h2>' + esc(scene.title) + '</h2><p>' + esc(scene.text) + '</p></div>'
      + '<div class="scene-actions"><button class="btn btn-primary" data-action="close-scene">继续这一生</button></div>'
      + '</section></div>';
  }

  function replayHtml() {
    const replay = state.replay;
    if (!replay) return '';
    const entries = replay.entries.filter(entry => entry && entry.text);
    if (entries.length === 0) return '';
    const index = Math.min(Math.max(0, replay.index || 0), entries.length - 1);
    const entry = entries[index];
    const tag = entry.kind === 'chapter' ? '章节' : entry.kind === 'birth' ? '出生' : entry.kind === 'death' ? '终局' : entry.isChoice ? (entry.autoChoice ? '命运选择' : '抉择') : entry.isPartner ? '相伴' : entry.isTwist ? '意外' : entry.milestone ? '人生节点' : '一年';
    return '<div class="modal"><section class="replay-modal" role="dialog" aria-modal="true" aria-label="回放这一生">'
      + '<div class="modal-head"><div><span class="modal-kicker">REPLAY SYSTEM</span><h2>' + esc(replay.title || '回放这一生') + '</h2><p>不改变结局，只是把走过的路再读一遍。</p></div><button class="close-btn" data-action="close-replay" aria-label="关闭回放">×</button></div>'
      + '<div class="progress"><i style="width:' + Math.round(((index + 1) / entries.length) * 100) + '%"></i></div>'
      + '<div class="replay-meta"><span>' + esc(tag) + '</span><b>' + entry.age + ' 岁</b><span>' + (index + 1) + ' / ' + entries.length + '</span></div>'
      + '<article class="replay-entry"><p>' + esc(entry.text) + '</p>' + deltaHtml(entry) + '</article>'
      + '<div class="replay-controls"><button class="btn btn-ghost btn-small" data-action="replay-first" ' + (index === 0 ? 'disabled' : '') + '>回到开头</button>'
      + '<button class="btn btn-ghost btn-small" data-action="replay-prev" ' + (index === 0 ? 'disabled' : '') + '>上一年</button>'
      + '<button class="btn btn-primary btn-small" data-action="replay-toggle">' + (replay.auto ? '暂停回放' : index >= entries.length - 1 ? '重新回放' : '自动回放') + '</button>'
      + '<button class="btn btn-ghost btn-small" data-action="replay-next" ' + (index >= entries.length - 1 ? 'disabled' : '') + '>下一年</button></div>'
      + '<p class="panel-note">系统只重读记录，不会改写已经发生的事。</p>'
      + '</section></div>';
  }

  function stopAuto() {
    state.auto = false;
    if (autoTimer) {
      clearInterval(autoTimer);
      autoTimer = null;
    }
  }

  function startAuto() {
    stopAuto();
    if (!state.run || !state.run.alive || state.run.pendingChoice || state.run.pendingScene) return;
    state.auto = true;
    autoTimer = setInterval(() => {
      if (!state.run || !state.run.alive || state.run.pendingChoice || state.run.pendingScene) {
        stopAuto();
        return;
      }
      advanceLife();
    }, AUTO_PLAY_MS);
  }

  function advanceLife() {
    if (!state.run || !state.run.alive || state.run.pendingChoice || state.run.pendingScene) return;
    state.run = advanceRun(state.run);
    if (!state.run.alive) {
      stopAuto();
      finalizeRecord();
    } else if (state.run.pendingChoice) {
      stopAuto();
    }
    state.pendingScroll = 'bottom';
    render();
  }

  function chooseOption(optionId) {
    if (!state.run || !state.run.pendingChoice) return;
    stopAuto();
    state.run = resolveChoice(state.run, optionId);
    if (!state.run.alive) finalizeRecord();
    state.pendingScroll = 'bottom';
    render();
  }

  function finalizeRecord() {
    const run = state.run;
    if (!run || !run.ending || run._recorded) return;
    const ending = run.ending;
    const mode = run.playMode === 'text' ? 'text' : 'interactive';
    const bucket = modeRecord(state.record, mode);
    const unlocked = Array.from(new Set([...(bucket.unlocked || []), ending.id]));
    const previousAchievements = Array.isArray(bucket.unlockedAchievements) ? bucket.unlockedAchievements : [];
    const previousSet = new Set(previousAchievements);
    const earned = ending.achievements
      .filter(item => (item.fun || item.persistent) && !previousSet.has(item.id))
      .map(item => item.id);
    const nextBucket = {
      ...bucket,
      best: Math.max(bucket.best || 0, run.score || 0),
      last: {
        age: run.age,
        score: run.score || 0,
        worldId: run.worldId,
        worldName: worldOf(run).name,
        title: ending.title,
        endingId: ending.id,
        grade: ending.grade.grade,
        label: ending.grade.label,
        epitaph: ending.epitaph,
      },
      unlocked,
      unlockedAchievements: previousAchievements.concat(earned),
      replay: buildReplaySnapshot(run),
    };
    state.record = withModeRecord(state.record, mode, nextBucket);
    writeRecord(state.record);
    run._recorded = true;
  }

  function startSetup() {
    state.view = 'setup';
    state.draft = newDraft(state.draft.worldId);
    state.pendingScroll = 'top';
    render();
  }

  function goHome() {
    if (state.run && state.run.alive && !window.confirm('这一生还没结束，确定回到开始界面？')) return;
    stopAuto();
    state.run = null;
    state.view = 'home';
    state.replay = null;
    state.pendingScroll = 'top';
    render();
  }

  function chooseWorld(worldId) {
    if (!WORLD_BY_ID[worldId] || state.draft.worldId === worldId) return;
    state.draft = newDraft(worldId);
    state.pendingScroll = 'top';
    render();
  }

  function changeAlloc(key, delta) {
    const draft = state.draft;
    if (delta > 0) {
      if (remainingPoints() <= 0 || (draft.alloc[key] || 0) >= ALLOC_MAX) return;
      draft.alloc = { ...draft.alloc, [key]: (draft.alloc[key] || 0) + 1 };
    } else {
      if ((draft.alloc[key] || 0) <= 0) return;
      draft.alloc = { ...draft.alloc, [key]: (draft.alloc[key] || 0) - 1 };
    }
    render();
  }

  function randomAlloc() {
    const values = emptyAlloc();
    const keys = currentWorld().attrs.map(item => item.key);
    for (let i = 0; i < TOTAL_POINTS; i += 1) {
      let key = keys[Math.floor(Math.random() * keys.length)];
      while (values[key] >= ALLOC_MAX) key = keys[Math.floor(Math.random() * keys.length)];
      values[key] += 1;
    }
    state.draft.alloc = values;
    render();
  }

  function toggleTalent(id) {
    const draft = state.draft;
    if (draft.selectedIds.includes(id)) {
      draft.selectedIds = draft.selectedIds.filter(item => item !== id);
    } else if (draft.selectedIds.length < TALENT_PICK_COUNT) {
      draft.selectedIds = draft.selectedIds.concat(id);
    }
    render();
  }

  function startLife() {
    if (!canStart()) return;
    const mode = state.playMode;
    const bucket = modeRecord(state.record, mode);
    const nextNumber = (bucket.runs || 0) + 1;
    state.record = withModeRecord(state.record, mode, { ...bucket, runs: nextNumber });
    writeRecord(state.record);
    const legacy = state.legacy;
    state.run = createRun(state.draft.alloc, selectedTalents(), state.draft.worldId, nextNumber, legacy, state.draft.gender);
    state.run.playMode = mode;
    state.legacy = null;
    state.view = 'game';
    stopAuto();
    state.pendingScroll = 'bottom';
    render();
  }

  function inheritLife() {
    const run = state.run;
    if (!run || !run.ending) return;
    const world = worldOf(run);
    const bestAttr = world.attrs.slice().sort((a, b) => (run.attrs[b.key] || 0) - (run.attrs[a.key] || 0))[0];
    state.legacy = {
      attr: bestAttr.key,
      label: bestAttr.name,
      amount: 2,
      wealth: 10,
      sourceWorld: world.name,
      sourceTitle: run.ending.title,
      sourceAge: run.age,
      sourceGrade: run.ending.grade.grade,
    };
    state.run = null;
    state.view = 'setup';
    state.draft = newDraft(world.id);
    state.pendingScroll = 'top';
    render();
  }

  function restartLife() {
    stopAuto();
    state.run = null;
    state.legacy = null;
    state.view = 'setup';
    state.draft = newDraft(state.draft.worldId);
    state.pendingScroll = 'top';
    render();
  }

  function openReplay() {
    const bucket = modeRecord(state.record, state.playMode);
    const entries = state.run && state.run.log
      ? state.run.log
      : bucket.replay && bucket.replay.log
        ? bucket.replay.log
        : null;
    if (!entries || entries.length === 0) {
      showToast('还没有可以回放的人生');
      return;
    }
    stopAuto();
    state.replay = {
      entries,
      title: state.run ? '回放这一生' : '回放上一生',
      index: 0,
      auto: false,
    };
    render();
  }

  function closeReplay() {
    if (replayTimer) {
      clearInterval(replayTimer);
      replayTimer = null;
    }
    state.replay = null;
    render();
  }

  function replayStep(delta) {
    if (!state.replay) return;
    const entries = state.replay.entries.filter(entry => entry && entry.text);
    state.replay.index = Math.max(0, Math.min(entries.length - 1, state.replay.index + delta));
    render();
  }

  function toggleReplayAuto() {
    if (!state.replay) return;
    const entries = state.replay.entries.filter(entry => entry && entry.text);
    if (state.replay.index >= entries.length - 1) state.replay.index = 0;
    state.replay.auto = !state.replay.auto;
    if (replayTimer) {
      clearInterval(replayTimer);
      replayTimer = null;
    }
    if (state.replay.auto) {
      replayTimer = setInterval(() => {
        if (!state.replay) {
          if (replayTimer) clearInterval(replayTimer);
          replayTimer = null;
          return;
        }
        const list = state.replay.entries.filter(entry => entry && entry.text);
        if (state.replay.index >= list.length - 1) {
          state.replay.auto = false;
          if (replayTimer) clearInterval(replayTimer);
          replayTimer = null;
          render();
          return;
        }
        state.replay.index += 1;
        render();
      }, 900);
    }
    render();
  }

  document.addEventListener('pointerdown', event => {
    if (!state.musicOn) return;
    const target = event.target && event.target.closest ? event.target.closest('[data-action]') : null;
    if (target && target.dataset.action === 'toggle-music') return;
    try { ensureMusic(); } catch { /* Audio is optional. */ }
  }, { passive: true });

  document.addEventListener('click', event => {
    const target = event.target.closest('[data-action]');
    if (!target) return;
    const action = target.dataset.action;
    if (action !== 'toggle-music') {
      try { ensureMusic(); } catch { /* Audio is optional. */ }
    }
    switch (action) {
      case 'toggle-music': toggleMusic(); break;
      case 'set-mode': setPlayMode(target.dataset.mode); break;
      case 'start-setup': startSetup(); break;
      case 'home': goHome(); break;
      case 'choose-world': chooseWorld(target.dataset.world); break;
      case 'set-gender':
        if (GENDER_MAP[target.dataset.gender]) {
          state.draft.gender = target.dataset.gender;
          render();
        }
        break;
      case 'alloc': changeAlloc(target.dataset.key, Number(target.dataset.dir)); break;
      case 'random-alloc': randomAlloc(); break;
      case 'clear-alloc': state.draft.alloc = emptyAlloc(); render(); break;
      case 'toggle-talent': toggleTalent(target.dataset.id); break;
      case 'reroll':
        if (state.draft.refreshes > 0) {
          state.draft = rerollTalents(state.draft);
          showToast('已重新抽取十张命运签');
          render();
        }
        break;
      case 'start-life': startLife(); break;
      case 'advance': advanceLife(); break;
      case 'choose-option': chooseOption(target.dataset.id); break;
      case 'refresh-quest': stopAuto(); state.run = refreshPendingQuest(state.run); render(); break;
      case 'close-scene': if (state.run) { state.run.pendingScene = null; state.pendingScroll = 'bottom'; render(); } break;
      case 'toggle-auto':
        if (state.auto) {
          stopAuto();
          render();
        } else {
          startAuto();
          render();
        }
        break;
      case 'inherit': inheritLife(); break;
      case 'restart': restartLife(); break;
      case 'clear-legacy': state.legacy = null; render(); break;
      case 'open-replay':
      case 'open-last-replay': openReplay(); break;
      case 'close-replay': closeReplay(); break;
      case 'replay-prev': replayStep(-1); break;
      case 'replay-next': replayStep(1); break;
      case 'replay-first': if (state.replay) { state.replay.index = 0; render(); } break;
      case 'replay-toggle': toggleReplayAuto(); break;
      case 'toggle-ach': state.showAllAchievements = !state.showAllAchievements; state.achPage = 0; render(); break;
      case 'ach-prev': state.achPage = Math.max(0, (state.achPage || 0) - 1); render(); break;
      case 'ach-next': state.achPage = Math.min(Math.max(0, Math.ceil(ACHIEVEMENT_TOTAL / 60) - 1), (state.achPage || 0) + 1); render(); break;
      case 'refresh-system':
        state.record = readRecord();
        state.pendingScroll = 'preserve';
        showToast('本地记录已重读');
        render();
        break;
      default: break;
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (state.auto) {
        stopAuto();
        render();
      }
      if (music && music.playing) stopMusic();
    } else if (state.musicOn && music && music.ctx.state === 'running') {
      startMusic();
    }
  });

  window.addEventListener('beforeunload', () => {
    stopAuto();
    if (replayTimer) clearInterval(replayTimer);
    if (music && music.timer) clearInterval(music.timer);
  });

  render();
})();
  </script>
</body>
</html>
