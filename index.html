<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="人生重开">
  <meta name="theme-color" content="#f3eee4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171512" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23f3eee4'/%3E%3Ccircle cx='90' cy='90' r='62' fill='none' stroke='%238e5c36' stroke-width='8'/%3E%3Cpath d='M90 45v90M62 72h56' stroke='%238e5c36' stroke-width='9' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23f3eee4'/%3E%3Ccircle cx='90' cy='90' r='62' fill='none' stroke='%238e5c36' stroke-width='8'/%3E%3Cpath d='M90 45v90M62 72h56' stroke='%238e5c36' stroke-width='9' stroke-linecap='round'/%3E%3C/svg%3E">
  <title>人生重开模拟器 · iPhone</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f3eee4;
      --bg-2: #e9e0d1;
      --panel: #fffaf1;
      --panel-2: #f7f0e4;
      --ink: #211d18;
      --muted: #746a5d;
      --faint: #a39888;
      --line: rgba(56, 44, 31, 0.13);
      --line-strong: rgba(56, 44, 31, 0.24);
      --brand: #8e5c36;
      --brand-soft: rgba(142, 92, 54, 0.1);
      --good: #4d7654;
      --bad: #a24d43;
      --warn: #9a6c24;
      --shadow: 0 16px 46px rgba(52, 38, 24, 0.12);
      --radius: 18px;
      --rarity-legend: #b8862f;
      --rarity-rare: #7d67b8;
      --rarity-good: #4f8a75;
      --rarity-common: #8b8173;
      --rarity-legend-bg: rgba(184, 134, 47, 0.11);
      --rarity-rare-bg: rgba(125, 103, 184, 0.1);
      --rarity-good-bg: rgba(79, 138, 117, 0.09);
      --rarity-common-bg: rgba(139, 129, 115, 0.08);
      --attr-looks: #b76e86;
      --attr-int: #5f82a8;
      --attr-body: #6f9364;
      --attr-family: #a57a42;
      --world-modern: #b8754e;
      --world-cultivation: #608b76;
      --world-wasteland: #a9824f;
      --world-magic: #7d6bc0;
      --world-cyber: #4f8faa;
      --world-starship: #6f86b8;
      --world-jianghu: #a45f4a;
      --ach-comedy: #b8862f;
      --ach-collection: #4f8a75;
      --ach-chaos: #8a6cc0;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --serif: "Songti SC", "STSong", "Noto Serif SC", Georgia, serif;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171512;
        --bg-2: #211d18;
        --panel: #211d18;
        --panel-2: #29241e;
        --ink: #f3eadb;
        --muted: #b8ac9b;
        --faint: #7e7364;
        --line: rgba(240, 224, 200, 0.13);
        --line-strong: rgba(240, 224, 200, 0.24);
        --brand: #d6a06b;
        --brand-soft: rgba(214, 160, 107, 0.12);
        --good: #8fc397;
        --bad: #e18e83;
        --warn: #e0b56f;
        --shadow: 0 18px 54px rgba(0, 0, 0, 0.35);
        --rarity-legend: #e5b85f;
        --rarity-rare: #b39ae8;
        --rarity-good: #8fc3a4;
        --rarity-common: #a69b8b;
        --rarity-legend-bg: rgba(229, 184, 95, 0.12);
        --rarity-rare-bg: rgba(179, 154, 232, 0.11);
        --rarity-good-bg: rgba(143, 195, 164, 0.1);
        --rarity-common-bg: rgba(166, 155, 139, 0.08);
        --attr-looks: #e0a0b5;
        --attr-int: #93b7da;
        --attr-body: #a7c28f;
        --attr-family: #d4ab72;
        --world-modern: #e0a077;
        --world-cultivation: #93c4aa;
        --world-wasteland: #d6ad73;
        --world-magic: #b3a0ef;
        --world-cyber: #86c2dc;
        --world-starship: #9fb6e5;
        --world-jianghu: #d6937c;
        --ach-comedy: #e5b85f;
        --ach-collection: #8fc3a4;
        --ach-chaos: #b39ae8;
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html {
      height: 100%;
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
    }
    body {
      min-height: 100%;
      margin: 0;
      background:
        radial-gradient(ellipse 90% 42% at 50% -8%, var(--brand-soft), transparent 68%),
        var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      overscroll-behavior-y: none;
      touch-action: manipulation;
    }
    body.modal-open { overflow: hidden; }
    button {
      appearance: none;
      border: 0;
      margin: 0;
      padding: 0;
      background: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:disabled { cursor: default; }
    h1, h2, h3, p { margin: 0; }
    .app {
      width: 100%;
      max-width: 620px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding-top: var(--safe-top);
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }
    .screen { padding-bottom: calc(104px + var(--safe-bottom)); }
    .screen.no-bottom { padding-bottom: calc(34px + var(--safe-bottom)); }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--brand);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }
    .eyebrow::before {
      content: "";
      width: 22px;
      height: 1px;
      background: var(--brand);
      opacity: 0.7;
    }
    .hero {
      padding: 30px 2px 18px;
      border-bottom: 1px solid var(--line);
    }
    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .hero-top .eyebrow { min-width: 0; flex: 1 1 auto; }
    .music-btn {
      display: inline-flex;
      flex: none;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-height: 31px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 99px;
      background: color-mix(in srgb, var(--panel) 55%, transparent);
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 0.03em;
      transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }
    .music-btn[data-on='true'] {
      border-color: color-mix(in srgb, var(--brand) 34%, var(--line));
      background: var(--brand-soft);
      color: var(--brand);
    }
    .music-glyph {
      font-size: 14px;
      line-height: 1;
    }
    .music-btn[data-on='true'] .music-glyph {
      animation: music-pulse 2.6s ease-in-out infinite;
    }
    .topbar .music-btn,
    .game-head .music-btn {
      width: 34px;
      height: 34px;
      min-height: 0;
      padding: 0;
    }
    .topbar .music-btn .music-label,
    .game-head .music-btn .music-label { display: none; }
    @keyframes music-pulse {
      0%, 100% { opacity: 0.68; }
      50% { opacity: 1; }
    }
    .hero h1 {
      margin-top: 14px;
      color: var(--ink);
      font-family: var(--serif);
      font-size: clamp(42px, 13.5vw, 62px);
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: 0.02em;
    }
    .hero h1 em {
      color: var(--brand);
      font-style: italic;
    }
    .hero .sub {
      max-width: 420px;
      margin-top: 13px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.9;
    }
    .hero .legacy-note {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
      margin-top: 11px;
      padding: 5px 8px;
      border: 1px solid color-mix(in srgb, var(--brand) 26%, var(--line));
      border-radius: 7px;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 10px;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 22px;
    }
    .stat {
      min-width: 0;
      padding: 9px 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: color-mix(in srgb, var(--panel) 72%, transparent);
      text-align: center;
    }
    .stat b {
      display: block;
      overflow: hidden;
      color: var(--ink);
      font-size: 17px;
      font-weight: 650;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .stat span { display: block; margin-top: 1px; color: var(--muted); font-size: 9px; }
    .stat:nth-child(1) b { color: var(--attr-looks); }
    .stat:nth-child(2) b { color: var(--attr-int); }
    .stat:nth-child(3) b { color: var(--world-modern); }
    .stat:nth-child(4) b { color: var(--ach-comedy); }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 16px;
      border: 1px solid transparent;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 620;
      letter-spacing: 0.02em;
      transition: transform 0.12s ease, opacity 0.12s ease, background 0.12s ease;
    }
    .btn:active { transform: scale(0.985); }
    .btn-primary { background: var(--ink); color: var(--bg); box-shadow: 0 7px 20px color-mix(in srgb, var(--ink) 16%, transparent); }
    .btn-ghost { border-color: var(--line-strong); background: color-mix(in srgb, var(--panel) 55%, transparent); color: var(--ink); }
    .btn-soft { border-color: color-mix(in srgb, var(--brand) 22%, var(--line)); background: var(--brand-soft); color: var(--brand); }
    .btn-small { min-height: 34px; padding: 0 10px; border-radius: 8px; font-size: 11px; }
    .btn-block { width: 100%; }
    .btn:disabled { opacity: 0.38; }
    .hero-actions { display: flex; gap: 8px; margin-top: 20px; }
    .hero-actions .btn-primary { flex: 1 1 auto; }
    .hero-actions .btn-ghost { flex: none; }
    .play-mode-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px; }
    .play-mode-switch button { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; min-height: 56px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--muted); text-align: left; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .play-mode-switch button b { color: var(--ink); font-family: var(--sans); font-size: 11px; font-weight: 700; letter-spacing: .04em; }
    .play-mode-switch button span { font-family: var(--sans); font-size: 8px; line-height: 1.45; }
    .play-mode-switch button[data-active="true"] { border-color: color-mix(in srgb, var(--brand) 42%, var(--line)); background: var(--brand-soft); color: var(--muted); }
    .play-mode-switch button[data-active="true"] b { color: var(--brand); }
    .play-mode-hint { margin: 6px 0 0; color: var(--muted); font-family: var(--sans); font-size: 8px; line-height: 1.6; }
    .world-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 16px;
    }
    .world-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 27px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: color-mix(in srgb, var(--panel) 52%, transparent);
      color: var(--muted);
      font-size: 9px;
    }
    .world-pill i { color: var(--world, var(--brand)); font-style: normal; font-size: 10px; }
    .world-pill[data-world='modern'], .world-chip[data-world='modern'] { --world: var(--world-modern); }
    .world-pill[data-world='cultivation'], .world-chip[data-world='cultivation'] { --world: var(--world-cultivation); }
    .world-pill[data-world='wasteland'], .world-chip[data-world='wasteland'] { --world: var(--world-wasteland); }
    .world-pill[data-world='magic'], .world-chip[data-world='magic'] { --world: var(--world-magic); }
    .world-pill[data-world='cyber'], .world-chip[data-world='cyber'] { --world: var(--world-cyber); }
    .world-pill[data-world] { border-left: 2px solid color-mix(in srgb, var(--world, var(--brand)) 62%, var(--line)); }
    .panel {
      margin-top: 14px;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      box-shadow: 0 1px 0 color-mix(in srgb, var(--ink) 4%, transparent);
    }
    .panel-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .panel-head h2 {
      color: var(--ink);
      font-family: var(--serif);
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .panel-head .kicker {
      display: block;
      margin-bottom: 2px;
      color: var(--brand);
      font-size: 8px;
      font-weight: 650;
      letter-spacing: 0.13em;
    }
    .panel-head em {
      color: var(--brand);
      font-size: 11px;
      font-style: normal;
      font-weight: 650;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .panel-note { margin-top: 8px; color: var(--muted); font-size: 10px; line-height: 1.65; }
    .panel-progress {
      height: 3px;
      margin-top: 8px;
      overflow: hidden;
      border-radius: 99px;
      background: var(--line);
    }
    .panel-progress i {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--ach-comedy), var(--ach-collection), var(--ach-chaos));
      transition: width 0.2s ease;
    }
    .ach-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5px;
      margin-top: 11px;
    }
    .ach-list.scroll {
      max-height: 360px;
      overflow-y: auto;
      padding-right: 3px;
      -webkit-overflow-scrolling: touch;
    }
    .ach-card {
      --ach: var(--ach-collection);
      display: flex;
      align-items: flex-start;
      gap: 6px;
      min-width: 0;
      padding: 7px 7px;
      border: 1px solid var(--line);
      border-left: 2px solid color-mix(in srgb, var(--ach) 34%, var(--line));
      border-radius: 7px;
      background: color-mix(in srgb, var(--panel-2) 62%, transparent);
      opacity: 0.58;
    }
    .ach-card[data-kind='comedy'] { --ach: var(--ach-comedy); }
    .ach-card[data-kind='chaos'] { --ach: var(--ach-chaos); }
    .ach-card[data-unlocked="true"] {
      border-color: color-mix(in srgb, var(--ach) 28%, var(--line));
      border-left-color: var(--ach);
      background: color-mix(in srgb, var(--ach) 6%, var(--panel-2));
      opacity: 1;
    }
    .ach-mark { flex: none; color: var(--ach); font-size: 10px; line-height: 1.5; }
    .ach-card strong {
      display: block;
      overflow: hidden;
      color: var(--ink);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.5;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .ach-card p {
      display: -webkit-box;
      overflow: hidden;
      margin-top: 1px;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.45;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .ach-actions { margin-top: 10px; }
    .ach-pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 9px;
    }
    .ach-pager span {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .04em;
      white-space: nowrap;
    }
    .ach-pager .btn:disabled { opacity: .35; }
    .replay-card {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      padding: 11px;
      border: 1px solid color-mix(in srgb, var(--brand) 22%, var(--line));
      border-radius: 10px;
      background: var(--brand-soft);
    }
    .replay-grade {
      display: grid;
      flex: none;
      place-items: center;
      width: 40px;
      height: 40px;
      border: 1px solid color-mix(in srgb, var(--brand) 32%, var(--line));
      border-radius: 9px;
      color: var(--brand);
      font-size: 13px;
      font-weight: 700;
    }
    .replay-copy { min-width: 0; flex: 1 1 auto; }
    .replay-copy strong {
      display: block;
      overflow: hidden;
      color: var(--ink);
      font-family: var(--serif);
      font-size: 13px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .replay-copy p { overflow: hidden; margin-top: 2px; color: var(--muted); font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
    .replay-empty {
      margin-top: 12px;
      padding: 22px 12px;
      border: 1px dashed var(--line);
      border-radius: 10px;
      color: var(--muted);
      text-align: center;
      font-size: 11px;
      line-height: 1.8;
    }
    .footnote {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 7px;
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      color: var(--faint);
      font-size: 8px;
      letter-spacing: 0.04em;
    }
    .topbar {
      position: sticky;
      top: var(--safe-top);
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 54px;
      margin: 0 -16px;
      padding: 8px 16px;
      padding-top: 8px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg) 84%, transparent);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .topbar-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .topbar-brand {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border: 1px solid color-mix(in srgb, var(--world, var(--brand)) 32%, var(--line));
      border-radius: 8px;
      background: color-mix(in srgb, var(--world, var(--brand)) 9%, transparent);
      color: var(--world, var(--brand));
      font-family: var(--serif);
      font-size: 13px;
    }
    .topbar-brand[data-world='modern'] { --world: var(--world-modern); }
    .topbar-brand[data-world='cultivation'] { --world: var(--world-cultivation); }
    .topbar-brand[data-world='wasteland'] { --world: var(--world-wasteland); }
    .topbar-brand[data-world='magic'] { --world: var(--world-magic); }
    .topbar-brand[data-world='cyber'] { --world: var(--world-cyber); }
    .topbar-copy { min-width: 0; }
    .topbar-copy b { display: block; color: var(--ink); font-size: 12px; font-weight: 650; }
    .topbar-copy span { display: block; overflow: hidden; color: var(--muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .topbar-actions { display: flex; align-items: center; gap: 6px; flex: none; }
    .mode-chip, .run-chip {
      display: inline-flex;
      align-items: center;
      height: 25px;
      padding: 0 7px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--muted);
      font-size: 8px;
      font-weight: 650;
      white-space: nowrap;
    }
    .mode-chip { border-color: color-mix(in srgb, var(--brand) 25%, var(--line)); color: var(--brand); }
    .setup { padding-bottom: calc(112px + var(--safe-bottom)); }
    .setup-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 1px 12px;
    }
    .setup-head h1 { color: var(--ink); font-family: var(--serif); font-size: 29px; font-weight: 500; }
    .setup-head p { margin-top: 3px; color: var(--muted); font-size: 10px; }
    .world-scroll {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
      margin: 0;
      padding: 2px 0 7px;
    }
    @media (max-width: 430px) {
      .world-scroll { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    function ensurePartnerName(run) {
      if (!run.flags.partnerName) run.flags.partnerName = pick(PARTNER_NAMES)
      return run.flags.partnerName
    }

    function choosePartnerStory(run) {
      const seen = run.flags._partnerSeen || (run.flags._partnerSeen = {})
      for (const story of PARTNER_STORIES) {
        if (seen[story.id]) continue
        if (story.when && !story.when(run)) continue
        seen[story.id] = true
        return story
      }
      return null
    }

    function pickFresh(run, pool) {
      if (!pool || !pool.length) return null
      const recent = run.recentTexts || []
      const fresh = pool.filter(item => item && item.text && !recent.includes(item.text))
      return pick(fresh.length ? fresh : pool)
    }

    function fillerText(run) {
      const pool = FILLER_LINES[run.worldId] || FILLER_LINES.modern
      const recent = run.recentTexts || []
      const fresh = pool.filter(text => !recent.includes(text))
      return pick(fresh.length ? fresh : pool)
    }

    function choiceRequirementEntries(run, option) {
      const req = option && option.requires
      if (!req || typeof req !== 'object') return []
      const world = worldOf(run)
      const entries = []
      Object.keys(req).forEach(key => {
        const value = req[key]
        if (key === 'wealth') {
          entries.push({ key, label: world.vitals.wealth, value, ok: run.wealth >= value, text: world.vitals.wealth + ' ≥ ' + value + world.vitals.wealthUnit })
        } else if (key === 'health') {
          entries.push({ key, label: world.vitals.health, value, ok: run.health >= value, text: world.vitals.health + ' ≥ ' + value })
        } else if (key === 'mood') {
          entries.push({ key, label: world.vitals.mood, value, ok: run.mood >= value, text: world.vitals.mood + ' ≥ ' + value })
        } else if (key === 'realm') {
          entries.push({ key, label: '境界', value, ok: (run.flags.realmIndex || 0) >= value, text: '境界 ≥ ' + (REALM_NAMES[value] || '凡人') })
        } else if (key === 'luck') {
          entries.push({ key, label: '运气', value, ok: (run.luck || 0) >= value, text: '运气 ≥ ' + value })
        } else if (key === 'flag') {
          entries.push({ key, label: '经历', value, ok: Boolean(run.flags[value]), text: '需要经历：' + value })
        } else {
          const attr = world.attrs.find(item => item.key === key)
          if (!attr) return
          entries.push({ key, label: attr.name, value, ok: (run.attrs[key] || 0) >= value, text: attr.name + ' ≥ ' + value })
        }
      })
      return entries
    }

    function canChooseOption(run, option) {
      if (!run || !option) return false
      return choiceRequirementEntries(run, option).every(item => item.ok)
    }

    function choiceRequirementText(run, option) {
      return choiceRequirementEntries(run, option).map(item => item.text)
    }

    function maybeOfferChoice(run) {
      if (!run || !run.alive || run.pendingChoice) return null
      const nodes = (CHOICE_NODES[run.worldId] || []).concat(COMMON_CHOICE_NODES)
      const seen = run.flags._choiceSeen || {}
      const eligible = nodes.filter(node => {
        if (seen[node.id]) return false
        if (run.age < node.at) return false
        if (node.when && !node.when(run)) return false
        return true
      })
      if (eligible.length === 0) return null
      const node = pick(eligible)
      if (Math.random() > (node.chance == null ? 0.85 : node.chance)) return null
      run.pendingChoice = {
        id: node.id,
        title: node.title,
        prompt: node.prompt,
        options: node.options.map(option => ({
          id: option.id,
          label: option.label,
          desc: option.desc,
          risk: option.risk || '',
          requires: option.requires || null,
          requireText: option.requireText || '',
          resolve: option.resolve,
        })),
      }
      return run.pendingChoice
    }

    function resolveChoice(source, optionId, meta) {
      if (!source || !source.pendingChoice) return source
      const next = cloneRun(source)
      const pending = next.pendingChoice
      const option = pending && pending.options.find(item => item.id === optionId)
      if (!option || !canChooseOption(next, option)) return source
      const before = snapshotNumbers(next)
      let result
      try {
        result = option.resolve(next)
      } catch {
        result = {
          tone: 'normal',
          text: '你做出了选择。很多年后回头看，这一天并没有什么特别，但路确实从这里拐了一个弯。',
          effects: { mood: 2 },
        }
      }
      applyEffects(next, result.effects)
      const deltas = numberDeltas(before, next)
      next.flags._choiceSeen = { ...(next.flags._choiceSeen || {}), [pending.id]: option.id }
      next.flags.lastChoice = option.id
      next.pendingChoice = null
      pushEntry(next, {
        kind: 'event',
        age: next.age,
        text: result.text,
        tone: result.tone || 'normal',
        deltas,
        isChoice: true,
        isQuest: pending.kind === 'quest',
        questResult: result.questResult || null,
        autoChoice: Boolean(meta && meta.auto),
        choiceLabel: pending.title,
      })
      if (result.sceneId && next.alive) openScene(next, result.sceneId)
      if (next.ascending) {
        finishLife(next, { silent: true })
        return next
      }
      if (next.health <= 0) {
        next.causeThisYear = next.causeThisYear || '抉择的代价'
        finishLife(next)
      }
      return next
    }

    function autoResolveChoice(source) {
      if (!source || !source.pendingChoice) return source
      const options = (source.pendingChoice.options || []).filter(option => canChooseOption(source, option))
      if (!options.length) {
        const next = cloneRun(source)
        next.pendingChoice = null
        return next
      }
      return resolveChoice(source, pick(options).id, { auto: true })
    }

    function questRealm(run) {
      return (run && run.flags && run.flags.realmIndex) || 0
    }

    function questChance(run, quest) {
      const int = run.attrs.int || 0
      const body = run.attrs.body || 0
      const realm = questRealm(run)
      const luck = run.luck || 0
      const base = 0.5 + int * 0.012 + body * 0.008 + realm * 0.03 + luck * 0.008
      return clamp(base - quest.difficulty * 0.82, 0.1, 0.92)
    }

    function questEligible(run, quest) {
      if (!quest || run.age < (quest.minAge || 0)) return false
      if (questRealm(run) < (quest.minRealm || 0)) return false
      if (quest.when && !quest.when(run)) return false
      if (quest.requires && !choiceRequirementEntries(run, { requires: quest.requires }).every(item => item.ok)) return false
      return true
    }

    function drawQuestOffers(run, count, exclude) {
      const pool = (QUEST_POOLS[run.worldId] || []).filter(quest => questEligible(run, quest))
      if (!pool.length) return []
      const seen = run.flags._questSeen || {}
      const excluded = exclude || []
      let source = pool.filter(quest => !seen[quest.id] && !excluded.includes(quest.id))
      if (source.length < count) source = pool.filter(quest => !excluded.includes(quest.id))
      if (source.length < count) source = pool.slice()
      if (!source.length) return []
      const picks = []
      while (picks.length < count && source.length) {
        picks.push(source.splice(rnd(source.length), 1)[0])
      }
      return picks
    }

    function questOption(run, quest) {
      const req = { ...(quest.requires || {}) }
      if (quest.minRealm) req.realm = Math.max(req.realm || 0, quest.minRealm)
      const chance = Math.round(questChance(run, quest) * 100)
      return {
        id: quest.id,
        label: quest.title,
        desc: quest.kind + ' · ' + quest.desc,
        risk: '当前成功率约 ' + chance + '%',
        requires: Object.keys(req).length ? req : null,
        questId: quest.id,
        resolve(next) {
          return resolveQuest(next, quest)
        },
      }
    }

    function makeQuestChoice(run, offers) {
      return {
        kind: 'quest',
        id: 'quest-' + run.age + '-' + rnd(9999),
        title: '这一年的任务',
        prompt: '有人把三件事放在你面前。你可以选一件去做，也可以刷新，看看还有没有别的路。',
        refreshLeft: 2,
        questIds: offers.map(quest => quest.id),
        options: offers.map(quest => questOption(run, quest)),
      }
    }

    function maybeOfferQuest(run) {
      if (!run || !run.alive || run.pendingChoice || run.pendingScene) return null
      if (run.age < 12) return null
      const last = run.flags.lastQuestAge || 0
      if (last && run.age - last < 6) return null
      if ((run.flags.questsDone || 0) >= 12) return null
      if (Math.random() > 0.72) return null
      const offers = drawQuestOffers(run, 3, [])
      if (offers.length === 0) return null
      run.flags.lastQuestAge = run.age
      run.pendingChoice = makeQuestChoice(run, offers)
      return run.pendingChoice
    }

    function refreshPendingQuest(source) {
      if (!source || !source.pendingChoice || source.pendingChoice.kind !== 'quest') return source
      if ((source.pendingChoice.refreshLeft || 0) <= 0) return source
      const next = cloneRun(source)
      const exclude = (next.pendingChoice.options || []).map(option => option.questId)
      const offers = drawQuestOffers(next, 3, exclude)
      if (!offers.length) return source
      next.pendingChoice.options = offers.map(quest => questOption(next, quest))
      next.pendingChoice.questIds = offers.map(quest => quest.id)
      next.pendingChoice.refreshLeft = Math.max(0, (next.pendingChoice.refreshLeft || 0) - 1)
      return next
    }

    function resolveQuest(run, quest) {
      const ok = Math.random() < questChance(run, quest)
      run.flags.lastQuestAge = run.age
      run.flags.questsDone = (run.flags.questsDone || 0) + 1
      run.flags._questSeen = { ...(run.flags._questSeen || {}), [quest.id]: true }
      if (ok) {
        if (quest.successFlags) Object.assign(run.flags, quest.successFlags)
        return {
          tone: 'good',
          text: quest.successText,
          effects: quest.successEffects || {},
          questResult: 'success',
          sceneId: quest.scene || null,
        }
      }
      if (quest.failFlags) Object.assign(run.flags, quest.failFlags)
      return {
        tone: 'tragic',
        text: quest.failText,
        effects: quest.failEffects || {},
        questResult: 'fail',
        sceneId: null,
      }
    }

    function openScene(run, sceneId) {
      const scene = SCENES[sceneId]
      if (!scene || !run) return false
      const seen = run.flags._scenes || (run.flags._scenes = {})
      if (seen[sceneId]) return false
      seen[sceneId] = true
      const text = typeof scene.text === 'function' ? scene.text(run) : scene.text
      pushEntry(run, { kind: 'scene', age: run.age, text, tone: 'milestone', sceneId, title: scene.title })
      if (scene.effects) applyEffects(run, scene.effects)
      if (run.playMode !== 'text' && run.alive) {
        run.pendingScene = {
          id: sceneId,
          title: scene.title,
          kicker: scene.kicker,
          text,
          art: scene.art || 'sect',
          stamp: 'SCENE ' + String(run.age).padStart(2, '0'),
        }
      }
      return true
    }

    function maybeTriggerScene(run, source) {
      if (!run || !run.alive || run.worldId !== 'cultivation') return false
      if (run.age >= 10 && !(run.flags._scenes && run.flags._scenes.sect_exam)) {
        return openScene(run, 'sect_exam')
      }
      if (source === 'milestone' && (run.flags.realmIndex || 0) >= 1 && !(run.flags._scenes && run.flags._scenes.first_realm)) {
        return openScene(run, 'first_realm')
      }
      return false
    }

    const REALM_NAMES = ['凡人', '炼气期', '筑基期', '结丹期', '元婴期', '化神期', '炼虚期', '合体期', '大乘期', '渡劫期', '真仙']
    const REALM_LIFESPAN = [100, 120, 250, 500, 1000, 2000, 3000, 5000, 10000, 12000, 999999]
    const REALM_YEAR_STEPS = [1, 1, 3, 8, 20, 40, 60, 100, 200, 200, 500]

    function rnd(n) {
      return Math.floor(Math.random() * n)
    }

    function pick(list) {
      return list[rnd(list.length)]
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value))
    }

    function sumAlloc(alloc) {
      return ATTRS.reduce((total, attr) => total + (alloc[attr.key] || 0), 0)
    }

    function drawTalents(worldId, count) {
      const world = WORLD_BY_ID[worldId] || WORLDS[0]
      const pool = world.talents.slice()
      const chosen = []
      const wanted = count || TALENT_DRAW_COUNT
      while (chosen.length < wanted && pool.length > 0) {
        const total = pool.reduce((sum, talent) => sum + (RARITY_WEIGHT[talent.rarity] || 1), 0)
        let roll = Math.random() * total
        let index = 0
        for (let i = 0; i < pool.length; i += 1) {
          roll -= RARITY_WEIGHT[pool[i].rarity] || 1
          if (roll <= 0) {
            index = i
            break
          }
        }
        chosen.push(pool[index])
        pool.splice(index, 1)
      }
      return chosen
    }

    function rerollTalents(draft) {
      const left = typeof draft.refreshes === 'number' ? draft.refreshes : TALENT_REFRESH_LIMIT
      if (left <= 0) return draft
      return {
        ...draft,
        choices: drawTalents(draft.worldId, TALENT_DRAW_COUNT),
        selectedIds: [],
        refreshes: left - 1,
      }
    }

    function emptyModeRecord() {
      return { runs: 0, best: 0, last: null, unlocked: [], unlockedAchievements: [], replay: null }
    }

    function normalizeModeRecord(parsed) {
      if (!parsed || typeof parsed !== 'object') return emptyModeRecord()
      return {
        runs: Number.isFinite(parsed.runs) ? Math.max(0, Math.floor(parsed.runs)) : 0,
        best: Number.isFinite(parsed.best) ? Math.max(0, Math.floor(parsed.best)) : 0,
        last: parsed.last && typeof parsed.last === 'object' ? parsed.last : null,
        unlocked: Array.isArray(parsed.unlocked)
          ? parsed.unlocked.filter(id => typeof id === 'string')
          : [],
        unlockedAchievements: Array.isArray(parsed.unlockedAchievements)
          ? parsed.unlockedAchievements.filter(id => typeof id === 'string')
          : [],
        replay: parsed.replay && Array.isArray(parsed.replay.log) && parsed.replay.log.some(entry => entry && typeof entry.text === 'string')
          ? {
            ...parsed.replay,
            log: parsed.replay.log.filter(entry => entry && typeof entry.text === 'string'),
          }
          : null,
      }
    }

    function defaultRecord() {
      return { version: 2, modes: { interactive: emptyModeRecord(), text: emptyModeRecord() } }
    }

    function modeRecord(record, mode) {
      const key = mode === 'text' ? 'text' : 'interactive'
      if (record && record.modes && record.modes[key]) return record.modes[key]
      if (key === 'interactive' && record && !record.modes) return normalizeModeRecord(record)
      return emptyModeRecord()
    }

    function withModeRecord(record, mode, nextModeRecord) {
      const key = mode === 'text' ? 'text' : 'interactive'
      const base = record && record.modes ? record : defaultRecord()
      return { version: 2, modes: { ...base.modes, [key]: nextModeRecord } }
    }

    function readRecord() {
      try {
        const raw = window.localStorage.getItem(STORAGE_KEY)
        if (!raw) return defaultRecord()
        const parsed = JSON.parse(raw)
        if (!parsed || typeof parsed !== 'object') return defaultRecord()
        if (parsed.modes && typeof parsed.modes === 'object') {
          return {
            version: 2,
            modes: {
              interactive: normalizeModeRecord(parsed.modes.interactive),
              text: normalizeModeRecord(parsed.modes.text),
            },
          }
        }
        if (!parsed.runs && !parsed.best && !parsed.last && !parsed.replay
          && !Array.isArray(parsed.unlocked) && !Array.isArray(parsed.unlockedAchievements)) {
          return defaultRecord()
        }
        const legacy = normalizeModeRecord(parsed)
        return {
          version: 2,
          modes: {
            interactive: legacy,
            text: normalizeModeRecord(parsed),
          },
        }
      } catch {
        return defaultRecord()
      }
    }

    function writeRecord(record) {
      try {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(record))
      } catch {
        /* Local storage can be unavailable; the game still works for this run. */
      }
    }

    function buildReplaySnapshot(run) {
      const ending = run.ending
      const log = Array.isArray(run.log)

          text: entry.text,
          tone: entry.tone,
          title: entry.title,
          milestone: Boolean(entry.milestone),
          isTwist: Boolean(entry.isTwist),
          cause: entry.cause,
          deltas: Array.isArray(entry.deltas) ? entry.deltas.map(delta => ({ ...delta })) : undefined,
        }))
        : []
      return {
        worldId: run.worldId,
        worldName: worldOf(run).name,
        age: run.age,
        score: run.score || 0,
        title: ending ? ending.title : '',
        endingId: ending ? ending.id : '',

        cause: run.cause,
        log,

      }
    }

    function aggregateTalents(talents) {
      const mods = { looks: 0, int: 0, body: 0, family: 0 }
      const flags = []
      let health = 0
      let mood = 0
      let wealth = 0
      let wealthMul = 1
      let lifespan = 0
      let luck = 0
      talents.forEach(talent => {
        if (talent.mods) {
          ATTRS.forEach(attr => { mods[attr.key] += talent.mods[attr.key] || 0 })
        }
        health += talent.health || 0
        mood += talent.mood || 0
        wealth += talent.wealth || 0
        wealthMul = Math.max(wealthMul, talent.wealthMul || 1)
        lifespan += talent.lifespan || 0
        luck += talent.luck || 0
        if (Array.isArray(talent.flags)) flags.push(...talent.flags)
      })
      ATTRS.forEach(attr => {
        mods[attr.key] = clamp(mods[attr.key], -5, TALENT_ATTR_CAP)
      })
      return {
        mods,
        flags,
        health: clamp(health, -20, TALENT_HEALTH_CAP),
        mood: clamp(mood, -30, TALENT_MOOD_CAP),
        wealth: clamp(wealth, 0, TALENT_WEALTH_CAP),
        wealthMul,
        lifespan: clamp(lifespan, 0, TALENT_LIFESPAN_CAP),
        luck: clamp(luck, -2, TALENT_LUCK_CAP),
      }
    }

    function createRun(alloc, talents, worldId, number, legacy, genderArg) {
      const world = WORLD_BY_ID[worldId] || WORLDS[0]
      const gender = GENDER_MAP[genderArg] ? genderArg : pick(GENDERS).key
      const aggregate = aggregateTalents(talents)
      const attrs = {}
      ATTRS.forEach(attr => {
        attrs[attr.key] = clamp((alloc[attr.key] || 0) + aggregate.mods[attr.key], 0, ATTR_MAX)
      })
      const legacyAttr = legacy && legacy.attr && attrs[legacy.attr] != null ? legacy.attr : null
      if (legacyAttr) {
        attrs[legacyAttr] = clamp(attrs[legacyAttr] + (legacy.amount || 2), 0, ATTR_MAX)
      }

      const flags = {}
      if (world.id === 'modern') {
        flags.parentsAlive = true
        flags.children = 0
        flags.married = false
        flags.partner = false
      } else if (world.id === 'cultivation') {
        flags.children = 0
        flags.daoPartner = false
        flags.realmIndex = 0
        flags.realmName = '凡人'
        flags.realm = '凡人'
        flags.sect = null
        flags.ascended = false
        flags.demon = false
      } else if (world.id === 'magic') {
        flags.children = 0
        flags.married = false
        flags.partner = false
        flags.magicRankIndex = 0
        flags.magicTitle = '未入学'
        flags.school = null
        flags.professor = false
        flags.headmaster = false
        flags.dragon = false
        flags.forbiddenMagic = false
      } else if (world.id === 'cyber') {
        flags.children = 0
        flags.partner = false
        flags.companions = 0
        flags.chrome = '原装身体'
        flags.job = null
        flags.employed = false
        flags.cyberPsycho = false
        flags.uploaded = false
        flags.legend = false
        flags.cityLegend = false
        flags.streetRep = 0
        flags.crew = false
      } else if (world.id === 'starship') {
        flags.children = 0
        flags.partner = false
        flags.crew = false
        flags.cadet = false
        flags.pilot = false
        flags.engineer = false
        flags.medic = false
        flags.captain = false
        flags.colonist = false
        flags.firstContact = false
        flags.aiFriend = false
        flags.sacrifice = false
        flags.lost = false
      } else if (world.id === 'jianghu') {
        flags.children = 0
        flags.daoPartner = false
        flags.sect = false
        flags.wanderer = false
        flags.swordHeart = false
        flags.sectMaster = false
        flags.constable = false
        flags.demon = false
        flags.doctor = false
        flags.teacher = false
        flags.retired = false
        flags.lastDuel = false
        flags.revenge = false
        flags.emperor = false
        flags.hiddenMaster = false
      } else {
        flags.children = 0
        flags.partner = false
        flags.companions = 0
        flags.infected = false
        flags.baseLeader = false
        flags.tyrant = false
      }
      if (flags.partner == null) flags.partner = false
      if (flags.married == null) flags.married = false
      if (typeof flags.children !== 'number') flags.children = 0
      if (flags.daoPartner == null) flags.daoPartner = false
      if (flags.partnerName == null) flags.partnerName = null
      flags.partnerLost = false
      flags._partnerSeen = {}
      if (flags.questsDone == null) flags.questsDone = 0
      if (flags.lastQuestAge == null) flags.lastQuestAge = 0
      if (flags.sectRank == null) flags.sectRank = ''
      if (flags._questSeen == null) flags._questSeen = {}
      if (flags._scenes == null) flags._scenes = {}
      aggregate.flags.forEach(flag => { flags[flag] = true })
      if (!flags._choiceSeen) flags._choiceSeen = {}
      if (legacy) {
        flags.legacy = true
        flags.legacyAttr = legacyAttr
      }

      let startWealth
      let health
      let mood
      let deathAge
      if (world.id === 'cultivation') {
        startWealth = Math.max(0, Math.round((attrs.family * 3 + rnd(8)) * aggregate.wealthMul + aggregate.wealth))
        health = clamp(65 + attrs.body * 4 + aggregate.health, 25, 100)
        mood = clamp(55 + rnd(11) - 5 + aggregate.mood, 15, 100)
        deathAge = clamp(70 + attrs.body * 2 + rnd(17) - 6 + aggregate.lifespan, 55, 120)
      } else if (world.id === 'wasteland') {
        startWealth = Math.max(0, Math.round((3 + attrs.family * 3 + rnd(8)) * aggregate.wealthMul + aggregate.wealth))
        health = clamp(55 + attrs.body * 4 + aggregate.health, 25, 100)
        mood = clamp(50 + rnd(15) - 5 + aggregate.mood, 15, 100)
        deathAge = clamp(50 + attrs.body * 4 + rnd(16) - 6 + aggregate.lifespan, 32, 120)
      } else if (world.id === 'magic') {
        startWealth = Math.max(0, Math.round((attrs.family * 5 + rnd(8)) * aggregate.wealthMul + aggregate.wealth))
        health = clamp(60 + attrs.body * 4 + aggregate.health, 25, 100)
        mood = clamp(55 + rnd(11) - 5 + aggregate.mood, 15, 100)
        deathAge = clamp(65 + attrs.body * 3 + rnd(15) - 6 + aggregate.lifespan, 40, 140)
      } else if (world.id === 'cyber') {
        startWealth = Math.max(0, Math.round((attrs.family * 4 + rnd(8)) * aggregate.wealthMul + aggregate.wealth))
        health = clamp(55 + attrs.body * 4 + aggregate.health, 25, 100)
        mood = clamp(50 + rnd(15) - 5 + aggregate.mood, 15, 100)
        deathAge = clamp(55 + attrs.body * 3 + rnd(15) - 5 + aggregate.lifespan, 35, 120)
      } else if (world.id === 'starship') {
        startWealth = Math.max(0, Math.round((attrs.family * 4 + rnd(9)) * aggregate.wealthMul + aggregate.wealth))
        health = clamp(60 + attrs.body * 4 + aggregate.health, 30, 100)
        mood = clamp(55 + rnd(13) - 5 + aggregate.mood, 15, 100)
        deathAge = clamp(65 + attrs.body * 3 + rnd(16) - 5 + aggregate.lifespan, 45, 130)
      } else if (world.id === 'jianghu') {
        startWealth = Math.max(0, Math.round((attrs.family * 5 + rnd(10)) * aggregate.wealthMul + aggregate.wealth))
        health = clamp(58 + attrs.body * 4 + aggregate.health, 28, 100)
        mood = clamp(52 + rnd(15) - 5 + aggregate.mood, 15, 100)
        deathAge = clamp(58 + attrs.body * 3 + rnd(16) - 5 + aggregate.lifespan, 40, 110)
      } else {
        startWealth = Math.max(0, Math.round((attrs.family * 9 + rnd(9)) * aggregate.wealthMul + aggregate.wealth))
        health = clamp(60 + attrs.body * 4 + aggregate.health, 25, 100)
        mood = clamp(55 + rnd(11) - 5 + aggregate.mood, 15, 100)
        deathAge = clamp(55 + attrs.body * 4 + rnd(15) - 8 + aggregate.lifespan, 35, 105)
      }
      if (legacy) startWealth = Math.max(0, startWealth + (legacy.wealth || 0))

      const birth = world.id === 'cultivation'
        ? cultivationBirthText(attrs)
        : world.id === 'wasteland'
          ? wastelandBirthText(attrs)
          : world.id === 'magic'
            ? magicBirthText(attrs)
            : world.id === 'cyber'
              ? cyberBirthText(attrs)
              : world.id === 'starship'
                ? starshipBirthText(attrs)
                : world.id === 'jianghu'
                  ? jianghuBirthText(attrs)
                  : modernBirthText(attrs)
      const chapter = world.id === 'cultivation'
        ? '序章 · 灵根入世'
        : world.id === 'wasteland'
          ? '序章 · 铁门之后'
          : world.id === 'magic'
            ? '序章 · 某个会发光的夜晚'
            : world.id === 'cyber'
              ? '序章 · 霓虹之下'
              : world.id === 'starship'
                ? '序章 · 舷窗之外'
                : world.id === 'jianghu'
                  ? '序章 · 小镇与山门'
                  : '序章 · 你来到人间'

      const openingLog = [
        { id: 0, kind: 'chapter', age: 0, text: chapter },
        { id: 1, kind: 'birth', age: 0, text: birth },
        { id: 2, kind: 'event', age: 0, tone: 'normal', text: '这一世，你是一个' + (gender === 'female' ? '女孩' : '男孩') + '。' },
      ]
      if (legacy) {
        openingLog.push({
          id: 3,
          kind: 'event',
          age: 0,
          tone: 'good',
          text: '你带着上一世的余荫出生。某种说不清的熟悉感还在，像一件没有完全脱下的旧衣服。',
        })
      }
      openingLog.forEach((entry, index) => { entry.id = index })

      return {
        id: 'lr-' + Date.now().toString(36) + '-' + rnd(9999),
        no: number,
        worldId: world.id,
        gender,
        genderLabel: GENDER_MAP[gender].label,
        pronoun: GENDER_MAP[gender].pronoun,
        age: 0,
        stage: 'child',
        lastYears: 1,
        pendingChoice: null,
        pendingScene: null,
        playMode: 'interactive',
        alive: true,
        deathAge,
        cause: null,
        finalCause: null,
        causeThisYear: null,
        attrs,
        talents,
        talentLead: talents[0] || null,
        luck: aggregate.luck,
        health,
        mood,
        wealth: startWealth,
        startWealth,
        peakWealth: startWealth,
        peakWealthAge: 0,
        legacy: legacy ? { ...legacy } : null,
        flags,
        seen: [],
        recentTexts: [],
        recentEventIds: [],
        lastEventId: null,
        seq: openingLog.length,
        log: openingLog,
        achievements: [],
        score: null,
        ending: null,
        createdAt: Date.now(),
      }
    }

    function cloneRun(run) {
      return {
        ...run,
        attrs: { ...run.attrs },
        flags: {
          ...run.flags,
          ...(run.flags._milestones ? { _milestones: { ...run.flags._milestones } } : {}),
          ...(run.flags._choiceSeen ? { _choiceSeen: { ...run.flags._choiceSeen } } : {}),
          ...(run.flags._partnerSeen ? { _partnerSeen: { ...run.flags._partnerSeen } } : {}),
          ...(run.flags._questSeen ? { _questSeen: { ...run.flags._questSeen } } : {}),
          ...(run.flags._scenes ? { _scenes: { ...run.flags._scenes } } : {}),
        },
        log: run.log.slice(),
        seen: run.seen.slice(),
        recentTexts: (run.recentTexts || []).slice(),
        recentEventIds: (run.recentEventIds || []).slice(),
        achievements: run.achievements ? run.achievements.slice() : [],
        ending: run.ending ? { ...run.ending, achievements: run.ending.achievements.slice() } : null,
      }
    }

    function pushEntry(run, entry) {
      const span = entry.kind === 'event' && (run.lastYears || 1) > 1 ? run.lastYears : null
      run.log = run.log.concat({ ...entry, span, id: run.seq })
      if (entry.text) run.recentTexts = (run.recentTexts || []).concat(entry.text).slice(-12)
      run.seq += 1
    }

    function matchesEvent(event, run) {
      if (event.stage !== run.stage) return false
      if (event.minAge != null && run.age < event.minAge) return false
      if (event.maxAge != null && run.age > event.maxAge) return false
      if (event.when && !event.when(run)) return false
      if (!event.repeatable && run.seen.includes(event.id)) return false
      return true
    }

    function chooseWeighted(pool, run) {
      if (pool.length === 0) return null
      const weights = pool.map(event => {
        const base = event.weight == null ? 1 : event.weight
        return event.good ? base * (1 + (run.luck || 0) * 0.08) : base
      })
      const total = weights.reduce((sum, n) => sum + n, 0)
      let roll = Math.random() * total
      for (let i = 0; i < pool.length; i += 1) {
        roll -= weights[i]
        if (roll <= 0) return pool[i]
      }
      return pool[pool.length - 1]
    }

    function chooseEvent(run) {
      const world = worldOf(run)
      let pool = world.events.filter(event => matchesEvent(event, run))
      if (pool.length > 1) {
        const recent = run.recentEventIds || []
        const fresh = pool.filter(event => event.id !== run.lastEventId && !recent.includes(event.id))
        if (fresh.length > 0) pool = fresh
      }
      if (pool.length === 0) {
        pool = world.events.filter(event => event.repeatable && event.stage === run.stage)
      }
      return chooseWeighted(pool, run)
    }

    function chooseTwist(run) {
      const world = worldOf(run)
      const pool = world.twists.filter(event => matchesEvent(event, run))
      if (pool.length === 0) return null
      return chooseWeighted(pool, run)
    }

    function chooseMilestone(run) {
      const world = worldOf(run)
      const cultivation = world.id === 'cultivation'
      const marks = cultivation && run.flags._milestones ? run.flags._milestones : {}
      for (const milestone of world.milestones) {
        if (cultivation) {
          if (run.age < milestone.age) continue
          if (marks[milestone.age]) continue
          if (run.flags.stalledRealm && ((run.flags.realmIndex || 0) + 1) === run.flags.stalledRealm) continue
        } else if (milestone.age !== run.age) {
          continue
        }
        if (milestone.when && !milestone.when(run)) continue
        return milestone
      }
      return null
    }

    function applyEffects(run, effects) {
      if (!effects) return
      ATTRS.forEach(attr => {
        const delta = effects[attr.key]
        if (typeof delta === 'number') {
          const grown = delta > 0 ? delta + (delta >= 2 ? 1 : 0) : delta
          run.attrs[attr.key] = clamp(run.attrs[attr.key] + grown, 0, ATTR_MAX)
        }
      })
      if (typeof effects.health === 'number') {
        run.health = clamp(run.health + effects.health, 0, 100)
      }
      if (typeof effects.mood === 'number') {
        const moodDelta = effects.mood > 0 ? Math.ceil(effects.mood * 0.6) : effects.mood
        run.mood = clamp(run.mood + moodDelta, 0, 100)
      }
      if (typeof effects.wealth === 'number') {
        let delta = effects.wealth
        if (delta < 0 && run.flags.frugal) delta = Math.round(delta * 0.6)
        run.wealth = Math.max(-50, Math.round(run.wealth + delta))
      }
      if (typeof effects.children === 'number') {
        run.flags.children = (run.flags.children || 0) + effects.children
      }
      if (typeof effects.companions === 'number') {
        run.flags.companions = Math.max(0, (run.flags.companions || 0) + effects.companions)
      }
      if (typeof effects.luck === 'number') {
        run.luck = clamp((run.luck || 0) + effects.luck, -2, 5)
      }
      if (typeof effects.lifespan === 'number') {
        const lifespanCap = worldOf(run).id === 'cultivation' ? 12000 : 160
        run.deathAge = clamp(run.deathAge + effects.lifespan, run.age + 1, lifespanCap)
      }
      if (typeof effects.lifespanAbsolute === 'number') {
        run.deathAge = Math.max(run.deathAge, effects.lifespanAbsolute)
      }
      if (effects.fatal) {
        run.health = 0
        if (effects.cause) run.causeThisYear = effects.cause
      }
      if (effects.flags && typeof effects.flags === 'object') {
        Object.assign(run.flags, effects.flags)
      }
      if (effects.cause) {
        run.causeThisYear = effects.cause
      }
      if (effects.finalCause) {
        run.finalCause = effects.finalCause
      }
      if (effects.ascend) {
        run.ascending = true
      }
      if (run.wealth > run.peakWealth) {
        run.peakWealth = run.wealth
        run.peakWealthAge = run.age
      }
    }

    function snapshotNumbers(run) {
      return {
        attrs: { ...run.attrs },
        health: run.health,
        mood: run.mood,
        wealth: run.wealth,
      }
    }

    function numberDeltas(before, run) {
      const deltas = []
      const world = worldOf(run)
      world.attrs.forEach(attr => {
        const change = run.attrs[attr.key] - before.attrs[attr.key]
        if (change !== 0) {
          deltas.push({ key: attr.key, label: attr.name, value: change, kind: change > 0 ? 'up' : 'down' })
        }
      })
      if (run.health !== before.health) {
        deltas.push({ key: 'health', label: world.vitals.health, value: run.health - before.health, kind: run.health > before.health ? 'up' : 'down' })
      }
      if (run.mood !== before.mood) {
        deltas.push({ key: 'mood', label: world.vitals.mood, value: run.mood - before.mood, kind: run.mood > before.mood ? 'up' : 'down' })
      }
      if (run.wealth !== before.wealth) {
        deltas.push({
          key: 'wealth',
          label: world.vitals.wealth,
          value: run.wealth - before.wealth,
          kind: run.wealth > before.wealth ? 'up' : 'down',
          money: true,
          unit: world.vitals.wealthUnit,
        })
      }
      return deltas
    }

    const CULTIVATION_STALL_CHANCE = 0.32

    function cultivationChance(run, target) {
      const base = 0.18
        + run.attrs.int * 0.028
        + run.attrs.looks * 0.008
        + run.attrs.body * 0.006
        + (run.luck || 0) * 0.035
        + (run.flags.breakthroughBonus || 0)
        - target * 0.032
      if (target === 10) return clamp(base * 0.28, 0.05, 0.22)
      return clamp(base, 0.03, 0.88)
    }

    function cultivationBreakthrough(run, targetName, successLines, failLines) {
      const realm = run.flags.realmIndex || 0
      if (realm >= 10) {
        return {
          tone: 'normal',
          text: '你已经站在真仙的位置上，再往上没有路，只有更高的天。',
          effects: { mood: 3 },
        }
      }
      const target = Math.min(10, realm + 1)
      const expected = REALM_NAMES[target]
      const aliases = {
        '练气': '炼气期',
        '炼气': '炼气期',
        '筑基': '筑基期',
        '金丹': '结丹期',
        '结丹': '结丹期',
        '元婴': '元婴期',
        '化神': '化神期',
        '炼虚': '炼虚期',
        '合体': '合体期',
        '大乘': '大乘期',
        '渡劫': '渡劫期',
        '真仙': '真仙',
      }
      const onTrack = targetName === expected || aliases[targetName] === expected
      const success = Math.random() < cultivationChance(run, target)
      const genericSuccess = [
        '这一次闭关没有惊天动地的异象。你只是在一个普通的清晨睁开眼，发现经脉里的灵气比从前宽了一条河。',
        '你失败了两次，第三次终于成功。突破的那一刻，你想起很多年前在山门前扫地的自己。',
        '瓶颈像一层旧纸，终于被你在某个无人知道的夜里捅破。你没有告诉任何人。',
      ]
      const genericFail = [
        '你冲击瓶颈失败，经脉里像塞了一团烧红的铁丝。你吐出一口血，把这次失败记在心里。',
        '瓶颈纹丝不动。你从闭关中醒来，发现自己又老了一点。',
        '你差一点就成了。差的那一点，让你在洞府里坐了很久。',
      ]
      const line = success
        ? pick(onTrack ? successLines : genericSuccess)
        : pick(onTrack ? failLines : genericFail)
      if (success) {
        const gains = target === 2
          ? { health: 10, int: 1, body: 1, mood: 5 }
          : target === 3
            ? { health: 15, int: 1, looks: 1, mood: 8 }
            : target === 4
              ? { health: 20, int: 1, mood: 10 }
              : target === 5
                ? { health: 25, int: 2, mood: 12 }
                : target === 6
                  ? { health: 30, int: 2, mood: 14 }
                  : target === 7
                    ? { health: 35, int: 2, mood: 16 }
                    : target === 8
                      ? { health: 40, int: 3, mood: 20 }
                      : target === 9
                        ? { health: 45, int: 3, mood: 25 }
                        : { health: 60, int: 4, mood: 30 }
        const lifespan = REALM_LIFESPAN[target]
        run.deathAge = target === 10
          ? Math.max(run.deathAge, 999999)
          : Math.max(run.deathAge, lifespan, run.age + 20) + (run.flags.lifespanBonus || 0)
        const flags = {
          realmIndex: target,
          realmName: expected,
          realm: expected,
          realmStage: target,
          breakthroughBonus: 0,
        }
        if (target === 10) {
          flags.ascended = true
          flags.realm = '真仙'
          flags.realmName = '真仙'
        }
        return {
          tone: target >= 8 ? 'legend' : 'milestone',
          text: line
            + (onTrack ? '' : '\n\n你踏入了' + expected + '。')
            + (target === 10
              ? '\n\n你踏入了真仙。天门在你身后缓缓合上。'
              : '\n\n你的寿元上限延至' + lifespan + '年。'),
          effects: {
            ...gains,
            flags,
            ...(target === 10 ? { ascend: true, finalCause: '飞升' } : {}),
          },
        }
      }
      const stallChance = target === 1 ? 0 : target <= 4 ? 0.52 : CULTIVATION_STALL_CHANCE
      const stalled = target === 10 || Math.random() < stallChance
      return {
        tone: 'bad',
        text: line
          + '\n\n你的境界仍停留在' + (REALM_NAMES[realm] || '凡人') + '。'
          + (target === 10
            ? '\n\n天门没有再开。你留在了渡劫期。'
            : stalled
              ? '\n\n这一次失败没有再来。你在' + (REALM_NAMES[realm] || '凡人') + '止步了。'
              : ''),
        effects: {
          health: target === 10 ? -24 : -(10 + target * 3),
          mood: target === 10 ? -14 : -5,
          flags: {
            breakthroughBonus: clamp((run.flags.breakthroughBonus || 0) + 0.06, 0, 0.3),
            ...(target === 10 ? { ascensionFailed: true } : {}),
            ...(stalled ? { stalledRealm: target } : {}),
          },
        },
      }
    }

    function addYear(run) {
      const world = worldOf(run)
      const previousStage = run.stage
      const years = world.id === 'cultivation' ? cultivationYears(run) : 1
      run.age += years
      run.lastYears = years
      run.causeThisYear = null
      const stage = stageFor(run.age)
      if (stage !== previousStage) {
        run.stage = stage
        pushEntry(run, { kind: 'chapter', age: run.age, text: world.stages[stage].chapter })
      }

      const milestone = chooseMilestone(run)
      let source = 'event'
      let current = milestone
      if (milestone) {
        source = 'milestone'
      } else {
        const partnerStory = choosePartnerStory(run)
        const twist = !partnerStory && Math.random() < world.twistChance ? chooseTwist(run) : null
        if (partnerStory) {
          source = 'partner'
          current = partnerStory
        } else if (twist) {
          source = 'twist'
          current = twist
        } else if (Math.random() < quietChance(run.age)) {
          source = 'quiet'
          current = null
        } else {
          current = chooseEvent(run)
        }
      }

      if (source === 'quiet') {
        const pool = world.quiet[run.stage] || world.quiet.child || []
        const quiet = pickFresh(run, pool) || { text: fillerText(run), effects: { mood: 1 } }
        const before = snapshotNumbers(run)
        applyEffects(run, quiet.effects)
        pushEntry(run, {
          kind: 'event',
          age: run.age,
          text: quiet.text,
          tone: 'normal',
          deltas: numberDeltas(before, run),
        })
      } else if (current) {
        let result
        const realmBefore = run.flags.realmIndex || 0
        const ascendedBefore = !!run.flags.ascended
        try {
          result = current.resolve(run)
        } catch (error) {
          result = {
            text: '这一年过得很平常，平常得你后来几乎想不起来发生了什么。',
            tone: 'normal',
            effects: { mood: 1 },
          }
        }
        const before = snapshotNumbers(run)
        applyEffects(run, result.effects)
        const deltas = numberDeltas(before, run)
        pushEntry(run, {
          kind: 'event',
          age: run.age,
          text: result.text,
          tone: result.tone || 'normal',
          deltas,
          milestone: source === 'milestone',
          isTwist: source === 'twist',
          isPartner: source === 'partner',
          title: source === 'twist' ? current.title : undefined,
        })
        if (source !== 'milestone' && source !== 'partner' && !current.repeatable) run.seen.push(current.id)
        if (source !== 'milestone' && source !== 'partner') {
          run.recentEventIds = (run.recentEventIds || []).concat(current.id).slice(-4)
          run.lastEventId = current.id
        }
        if (source === 'milestone' && world.id === 'cultivation') {
          const marks = run.flags._milestones || (run.flags._milestones = {})
          const progressed = (run.flags.realmIndex || 0) > realmBefore || (!ascendedBefore && run.flags.ascended)
          if (!current.retry || progressed) marks[current.age] = true
        }
      } else {
        pushEntry(run, {
          kind: 'event',
          age: run.age,
          tone: 'normal',
          text: fillerText(run),
          deltas: [],
        })
      }

      if (run.ascending) {
        finishLife(run, { silent: true })
        return run
      }

      const aging = world.aging
      let agingStart = aging.start
      let agingMid = aging.mid
      let agingLate = aging.late
      if (world.id === 'cultivation') {
        agingStart = Math.max(70, run.deathAge - 50)
        agingMid = Math.max(agingStart + 10, run.deathAge - 30)
        agingLate = Math.max(agingMid + 5, run.deathAge - 12)
      }
      if (run.age > agingStart) {
        const healthBeforeAging = run.health
        const decline = run.age < agingMid ? 1 : run.age < agingLate ? 2 : 3
        const spanFactor = world.id === 'cultivation' ? Math.max(1, Math.min(3, Math.round(years / 8))) : 1
        run.health = clamp(run.health - decline * spanFactor, 0, 100)
        const actual = healthBeforeAging - run.health
        if (actual > 0) {
          const last = run.log[run.log.length - 1]
          if (last && last.kind === 'event') {
            const agingLabel = world.id === 'cultivation' ? '岁月' : world.id === 'wasteland' ? '旧伤' : '衰老'
            last.deltas = (last.deltas || []).concat({
              key: 'aging',
              label: agingLabel,
              value: -actual,
              kind: 'down',
            })
          }
          if (run.health <= 0) run.causeThisYear = aging.oldAgeCause
        }
      }

      if (run.health > 0 && run.health < aging.riskThreshold && Math.random() < aging.riskChance) {
        run.health = 0
        run.causeThisYear = aging.riskCause
      }

      if (run.age >= run.deathAge || run.health <= 0) {
        finishLife(run)
      }
      if (run.alive && !run.pendingChoice && !run.pendingScene) maybeTriggerScene(run, source)
      if (run.alive && !run.pendingChoice && !run.pendingScene) maybeOfferQuest(run)
      if (run.pendingScene) return run
      if (run.alive && !run.pendingChoice) maybeOfferChoice(run)
      if (run.pendingChoice && run.playMode === 'text') return autoResolveChoice(run)
      return run
    }

      const next = cloneRun(run)

      if (run.flags.legend) add('legend', '城市传说', '有人在网路的角落里用你的名字吓唬新人。')
      if (run.flags.corpEmployee) add('corp', '公司人', '你成了你小时候在广告里看见的那种人。')
      if (run.flags.uploaded) add('uploaded', '上传者', '你的一部分已经住进了服务器。')
      if (run.flags.cyberPsycho) add('psycho', '赛博精神病', '你的义体和城市达成了某种危险的共识。')
      if (run.flags.partner) add('partner', '有人等门', '在这座城市里，有一个人知道你今天回不回来。')
      if ((run.flags.children || 0) > 0) add('heir', '下一代市民', '你的孩子会在同一片霓虹下长大。')
      if (run.peakWealth >= 200) add('wealth', '顶层账户', '你的信用点足够买下很多人的安静。')
      if (run.age >= 80) add('longlife', '系统还在运行', '你活得比很多型号的义体都久。')
      if (run.age < 25) add('meteor', '还没来得及出名', '你还没在城里留下名字，就先下线了。')
      return achievements
    }

    function computeAchievements(run) {
      if (run.worldId === 'cultivation') return cultivationAchievements(run)
      if (run.worldId === 'wasteland') return wastelandAchievements(run)
      if (run.worldId === 'magic') return magicAchievements(run)
      if (run.worldId === 'cyber') return cyberAchievements(run)
      if (run.worldId === 'starship') return starshipAchievements(run)
      if (run.worldId === 'jianghu') return jianghuAchievements(run)
      return modernAchievements(run)
    }

    function computeComedyAchievements(run) {
      return ALL_ACHIEVEMENTS
        .filter(item => {
          if (item.ending) return false
          try { return item.when(run) } catch { return false }
        })
        .map(item => ({
          id: item.id,
          label: item.title,
          desc: item.desc,
          fun: COMEDY_IDS.has(item.id) || Boolean(item.fun),
          persistent: true,
        }))
    }

    function computeEndingAchievements(run) {
      return ENDING_ACHIEVEMENTS
        .filter(item => {
          try { return item.when(run) } catch { return false }
        })
        .map(item => ({
          id: item.id,
          label: item.title,
          desc: item.desc,
          fun: Boolean(item.fun),
          persistent: true,
          ending: true,
        }))
    }

    function computeScore(run, achievements) {
      const longevity = run.worldId === 'cultivation'
        ? Math.min(340, Math.round(Math.log10(Math.max(1, run.age) + 1) * 110))
        : Math.min(run.age, 130) * 2.1
      const wealthScore = Math.min(250, Math.round(Math.log10(Math.max(0, run.peakWealth) + 1) * 62))
      const moodScore = Math.round(run.mood * 1.6)
      const healthScore = Math.round(run.health * 0.8)
      const growth = Math.min(180, Math.round(
        (run.attrs.looks + run.attrs.int + run.attrs.body + run.attrs.family) * 2.5,
      ))
      const legacy = Math.min(220, achievements.length * 20)
      return clamp(Math.round(longevity + wealthScore + moodScore + healthScore + growth + legacy), 0, 1000)
    }

      if (run.worldId === 'cyber') return cyberDeathText(run, cause)

      if (run.worldId === 'jianghu') return jianghuDeathText(run, cause)
      return modernDeathText(run)
    }

    function determineEnding(run) {
      const world = worldOf(run)
      const findById = id => world.endings.find(ending => ending.id === id)
      const forced = run.worldId === 'cultivation'
        ? run.flags.ascended || run.cause === '飞升'
          ? run.flags.swordHeart
            ? 'cult_ascend_sword'
            : run.flags.demon
              ? 'cult_ascend_demon'
              : !run.flags.daoPartner
                ? 'cult_ascend_alone'
                : 'cult_ascend'
          : null
        : run.worldId === 'wasteland'
          ? run.cause === '感染'
            ? 'waste_zombie'
            : run.cause === '牺牲'
              ? 'waste_martyr'
              : null
          : run.worldId === 'cyber'
            ? run.cause === '数据删除'
              ? 'cyber_formatted'
              : run.cause === '义体排斥'
                ? 'cyber_psycho'
                : null
            : null
      if (forced && findById(forced)) return findById(forced)
      const pool = world.endings.filter(ending => {
        try { return ending.when(run) } catch { return false }
      })
      const specific = pool.filter(ending => !ending.isDefault)
      const candidates = specific.length > 0 ? specific : pool
      if (candidates.length === 0) return world.endings[world.endings.length - 1]
      const toneWeight = { legend: 4, great: 2, normal: 1, tragic: 2, strange: 2.2, good: 1.5 }
      const weights = candidates.map(ending => toneWeight[ending.tone] || 1)
      const total = weights.reduce((sum, value) => sum + value, 0)
      let roll = Math.random() * total
      for (let i = 0; i < candidates.length; i += 1) {
        roll -= weights[i]
        if (roll <= 0) return candidates[i]
      }
      return candidates[candidates.length - 1]
    }

    function finishLife(run, options) {
      const world = worldOf(run)
      const silent = Boolean(options && options.silent)
      run.alive = false
      run.cause = run.finalCause
        || (run.health <= 0
          ? (run.causeThisYear || world.aging.riskCause || '疾病')
          : world.aging.oldAgeCause)
      if (!silent) {
        pushEntry(run, {
          kind: 'death',
          age: run.age,
          text: deathText(run, run.cause),
          cause: run.cause,
        })
      }
      const achievements = computeAchievements(run)
      const funAchievements = computeComedyAchievements(run)
      const score = computeScore(run, achievements)
      const grade = world.grades.find(item => score >= item.min) || world.grades[world.grades.length - 1]
      run.score = score
      const endingDef = determineEnding(run)
      run.ending = {
        id: endingDef.id,
        title: endingDef.title,
        description: endingDef.description,
        tone: endingDef.tone,
        comedy: Boolean(endingDef.comedy),
        grade,
        score,
        achievements: [],
        epitaph: computeEpitaph(run),
        worldId: run.worldId,
      }
      const endingAchievements = computeEndingAchievements(run)
      const finalAchievements = achievements.concat(funAchievements, endingAchievements)
      run.achievements = finalAchievements
      run.ending.achievements = finalAchievements
    }
